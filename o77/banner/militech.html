<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Militech Banner</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Militech-themed OPEN//77 server banner + icon (fan-made, original artwork drawn in code; crisp, no glitch/blur).
//   militech.html?w=1200&h=400  (banner)   ·   militech.html?w=256&h=256  (icon)
const Q = new URLSearchParams(location.search), W = +(Q.get('w') || 1200), H = +(Q.get('h') || 400);
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
const STEEL = '#0C0F0E', OLIVE = '#2B3326', KHAKI = '#B9AE8A', AMBER = '#F2A007', RED = '#D8261C', WHITE = '#ECE8DC';
let seed = 1977; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const SQ = W / H < 1.6, S = SQ ? W / 512 : W / 1200;
const WORD = (w, s, st = 'expanded') => { c.font = `${w} ${s}px "Archivo Wide"`; c.fontStretch = st; };
const MONO = (w, s) => { c.font = `${w} ${s}px "JetBrains Mono"`; };

function poly(pts, fill) { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } }
function hexMesh(alpha) { const r = 14 * S, h = r * Math.sqrt(3); c.save(); c.globalAlpha = alpha; c.strokeStyle = KHAKI; c.lineWidth = Math.max(1, S * 0.8);
  for (let y = -h, row = 0; y < H + h; y += h / 2, row++) for (let x = (row % 2) * r * 1.5 - r * 3; x < W + r * 3; x += r * 3) { c.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; c.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); } c.closePath(); c.stroke(); } c.restore(); }
function hazard(x, y, w, h, n) { c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.fillStyle = AMBER; c.fillRect(x, y, w, h); c.fillStyle = STEEL; const st = h * 1.1;
  for (let i = -2; i < w / st + 2; i++) poly([[x + i * st * 2, y + h], [x + i * st * 2 + st, y + h], [x + i * st * 2 + st * 2, y], [x + i * st * 2 + st, y]], STEEL); c.restore(); }
// emblem: shield with an angular M chevron (original mark in the Militech spirit)
function emblem(cx, cy, s) {
  const sh = [[-1, -1.1], [1, -1.1], [1, 0.35], [0, 1.15], [-1, 0.35]].map(([x, y]) => [cx + x * s, cy + y * s]);
  poly(sh, AMBER);
  const inner = [[-0.84, -0.95], [0.84, -0.95], [0.84, 0.27], [0, 0.95], [-0.84, 0.27]].map(([x, y]) => [cx + x * s, cy + y * s]);
  poly(inner, STEEL);
  // M chevron
  const m = [[-0.6, 0.45], [-0.6, -0.68], [-0.32, -0.68], [0, -0.18], [0.32, -0.68], [0.6, -0.68], [0.6, 0.45], [0.36, 0.45], [0.36, -0.22], [0, 0.3], [-0.36, -0.22], [-0.36, 0.45]].map(([x, y]) => [cx + x * s, cy + y * s]);
  poly(m, WHITE);
  poly([[-0.6, 0.58], [0.6, 0.58], [0, 0.86]].map(([x, y]) => [cx + x * s, cy + y * s]), RED);
}
function brackets(m, l, col, lw) { c.strokeStyle = col; c.lineWidth = lw; [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { c.beginPath(); c.moveTo(x, y + sy * l); c.lineTo(x, y); c.lineTo(x + sx * l, y); c.stroke(); }); }
function ground() {
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#141A14'); g.addColorStop(0.6, '#0B0E0C'); g.addColorStop(1, '#050605'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const r = c.createRadialGradient(W * (SQ ? 0.5 : 0.78), H * 0.45, 0, W * (SQ ? 0.5 : 0.78), H * 0.45, Math.max(W, H) * 0.6); r.addColorStop(0, 'rgba(242,160,7,0.16)'); r.addColorStop(1, 'transparent'); c.fillStyle = r; c.fillRect(0, 0, W, H);
  hexMesh(0.05);
  // topo / radar rings
  c.save(); c.strokeStyle = KHAKI; c.globalAlpha = 0.08; c.lineWidth = Math.max(1, S); const ox = W * (SQ ? 0.5 : 0.8), oy = H * 0.5;
  for (let k = 1; k < 9; k++) { c.beginPath(); c.arc(ox, oy, k * 46 * S, 0, 7); c.stroke(); } c.beginPath(); c.moveTo(ox - W, oy); c.lineTo(ox + W, oy); c.moveTo(ox, oy - H); c.lineTo(ox, oy + H); c.stroke(); c.restore();
  // brushed-metal streaks
  c.save(); c.globalAlpha = 0.05; c.fillStyle = '#fff'; for (let i = 0; i < 120; i++) c.fillRect(0, rnd() * H, W, Math.max(1, S * rnd())); c.restore();
}
function finish() { const v = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75); v.addColorStop(0, 'transparent'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  const img = c.getImageData(0, 0, W, H), d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * (SQ ? 4 : 10); d[i] += n; d[i + 1] += n; d[i + 2] += n; } c.putImageData(img, 0, 0); }

async function draw() {
  await document.fonts.load('900 100px "Archivo Wide"'); await document.fonts.load('700 20px "JetBrains Mono"');
  ground();
  if (!SQ) {
    // angled steel panel on the left
    poly([[0, 0], [700 * S, 0], [620 * S, H], [0, H]], 'rgba(8,10,9,0.78)');
    c.strokeStyle = 'rgba(185,174,138,0.35)'; c.lineWidth = 2 * S; c.beginPath(); c.moveTo(700 * S, 0); c.lineTo(620 * S, H); c.stroke();
    hazard(0, 0, W, 10 * S); hazard(0, H - 10 * S, W, 10 * S);
    const X = 60 * S;
    MONO(700, 15 * S); c.fillStyle = AMBER; c.fillText('// MILITECH  ·  NIGHT CITY DIVISION', X, 92 * S);
    WORD(900, 104 * S, 'ultra-expanded'); c.fillStyle = WHITE; c.fillText('MILITECH', X - 4 * S, 196 * S);
    const mw = c.measureText('MILITECH').width;
    c.fillStyle = AMBER; c.fillRect(X, 216 * S, mw * 0.7, 8 * S); c.fillStyle = RED; c.fillRect(X + mw * 0.7 + 10 * S, 216 * S, mw * 0.12, 8 * S);
    WORD(800, 24 * S, 'expanded'); c.fillStyle = KHAKI; c.fillText('ARMED  ·  ARMORED  ·  AUTHORIZED', X, 266 * S);
    MONO(600, 14 * S); c.fillStyle = 'rgba(236,232,220,0.7)'; c.fillText('OPEN//77 COMMUNITY SERVER   //   CLEARANCE: CIVILIAN', X, 330 * S);
    // emblem + HUD on the right
    emblem(W * 0.8, H * 0.47, 112 * S);
    MONO(600, 12 * S); c.fillStyle = 'rgba(185,174,138,0.75)'; c.textAlign = 'right';
    c.fillText('MT-77 / SEC-OPS', W - 40 * S, 52 * S); c.fillText('LAT 37.77 N  ·  LON 122.41 W', W - 40 * S, H - 32 * S); c.textAlign = 'left';
    brackets(22 * S, 40 * S, AMBER, 3 * S);
  } else {
    hazard(0, 0, W, 12 * S); hazard(0, H - 12 * S, W, 12 * S);
    emblem(W / 2, 215 * S, 140 * S);
    WORD(900, 62 * S, 'ultra-expanded'); c.textAlign = 'center'; c.fillStyle = WHITE; c.fillText('MILITECH', W / 2, 438 * S); c.textAlign = 'left';
  }
  finish(); document.title = 'done';
}
draw();
</script></body></html>
