<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Watch Live End Card</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// End card for the PUBG clips — transparent 1080x1920 overlay, 30 fps, composited over the clip's closing freeze (the game half,
// y ≥ 1180). Timeline (local seconds): dark band + flash · "WATCH LIVE ON" slams in · "KICK & TWITCH!" slams in · Kick and Twitch
// tiles pop with overshoot · handle types on · then everything breathes (bob, glow pulse, shine sweep, LIVE dot).
(() => {
  const c = document.getElementById('c').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2, FPS = 30;
  const KICK = '#53FC18', TWI = '#9146FF', RED = '#FF2A2A';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), prog = (t, a, b) => clamp((t - a) / (b - a));
  const outBack = (p) => { const s = 1.9; p -= 1; return 1 + p * p * ((s + 1) * p + s); }, out3 = (p) => 1 - Math.pow(1 - p, 3);
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  let kick, twitch;
  // ?dy=N shifts the whole card vertically; ?local=1 swaps the full bottom band for a soft shadow behind the card only
  const Q = new URLSearchParams(location.search), DY = +(Q.get('dy') || 0), LOCAL = Q.get('local') === '1';

  function slam(text, x, y, size, fill, t0, t, rot = -0.04) {
    const p = prog(t, t0, t0 + 0.22); if (p <= 0) return; const s = 1 + (1 - outBack(p)) * 0.9, a = clamp(p * 3);
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.globalAlpha = a; c.font = 'italic ' + D(size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(text, 8, 12); c.lineWidth = size * 0.17; c.strokeStyle = '#000'; c.strokeText(text, 0, 0);
    if (Array.isArray(fill)) {   // [[segment, colour], ...] — solid colour per word, so nothing bleeds across the glyph edges
      c.textAlign = 'left'; let x0 = -c.measureText(text).width / 2;
      for (const [seg, col] of fill) { c.fillStyle = col; c.fillText(seg, x0, 0); x0 += c.measureText(seg).width; }
      c.textAlign = 'center';
    } else { c.fillStyle = fill; c.fillText(text, 0, 0); }
    // shine sweep across the word after it lands
    const sp = ((t - t0 - 0.6) % 2.2) / 0.5; if (t > t0 + 0.6 && sp > 0 && sp < 1) { const w = c.measureText(text).width, sx = -w / 2 + sp * w * 1.4 - w * 0.2;
      const g = c.createLinearGradient(sx - 60, 0, sx + 60, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillText(text, 0, 0); }
    c.restore();
  }
  function tile(logo, bg, ring, x, y, t0, t, k) {
    const p = prog(t, t0, t0 + 0.32); if (p <= 0) return; const s = outBack(p) * (1 + 0.03 * Math.sin((t - t0) * 4 + k)), bob = Math.sin((t - t0) * 3 + k) * 8, size = 220;
    c.save(); c.translate(x, y + bob); c.rotate((1 - p) * (k ? 0.5 : -0.5) + Math.sin((t - t0) * 2 + k) * 0.03); c.scale(s, s);
    const glow = 0.55 + 0.35 * Math.sin((t - t0) * 5 + k); c.shadowColor = ring; c.shadowBlur = 60 * glow;
    rr(-size / 2, -size / 2, size, size, 48); c.fillStyle = bg; c.fill(); c.shadowBlur = 0; c.lineWidth = 8; c.strokeStyle = ring; c.stroke();
    const lw = logo === kick ? 130 : 128, lh = lw * logo.height / logo.width; c.drawImage(logo, -lw / 2, -lh / 2, lw, lh);
    c.restore();
  }

  function renderAt(t) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    // dark band over the game half
    c.translate(0, DY);
    const band = out3(prog(t, 0, 0.3)); c.save(); c.globalAlpha = band; let g;
    if (LOCAL) { c.save(); c.translate(540, 1505); c.scale(1, 0.62); g = c.createRadialGradient(0, 0, 120, 0, 0, 640); g.addColorStop(0, 'rgba(6,4,14,0.78)'); g.addColorStop(0.6, 'rgba(6,4,14,0.55)'); g.addColorStop(1, 'rgba(6,4,14,0)'); c.fillStyle = g; c.fillRect(-640, -640, 1280, 1280); c.restore(); }
    else { g = c.createLinearGradient(0, 1120, 0, H); g.addColorStop(0, 'rgba(6,4,14,0)'); g.addColorStop(0.12, 'rgba(6,4,14,0.82)'); g.addColorStop(1, 'rgba(6,4,14,0.92)'); c.fillStyle = g; c.fillRect(0, 1120, W, H - 1120); }
    // speed lines from the logos
    c.translate(540, 1640); for (let i = 0; i < (LOCAL ? 0 : 40); i++) { const a = i / 40 * TAU + t * 0.15; c.beginPath(); c.moveTo(Math.cos(a) * 260, Math.sin(a) * 260); c.lineTo(Math.cos(a) * 1200, Math.sin(a) * 1200); c.strokeStyle = i % 2 ? 'rgba(83,252,24,0.07)' : 'rgba(145,70,255,0.08)'; c.lineWidth = 14; c.stroke(); } c.restore();
    // impact flash on each slam
    [0.15, 0.45].forEach((t0) => { const f = 1 - prog(t, t0, t0 + 0.18); if (t >= t0 && f > 0) { c.fillStyle = `rgba(255,255,255,${0.35 * f})`; if (LOCAL) c.fillRect(0, 1180, W, 680); else c.fillRect(0, 1120, W, H - 1120); } });
    // LIVE chip
    const lp = prog(t, 0.05, 0.25); if (lp > 0) { c.save(); c.globalAlpha = lp; c.translate(540, 1190); rr(-95, -34, 190, 68, 34); c.fillStyle = RED; c.shadowColor = 'rgba(255,40,40,0.8)'; c.shadowBlur = 24; c.fill(); c.shadowBlur = 0;
      c.fillStyle = `rgba(255,255,255,${0.55 + 0.45 * (Math.floor(t * 2.5) % 2)})`; c.beginPath(); c.arc(-50, 0, 11, 0, TAU); c.fill(); c.font = D(38); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.letterSpacing = '3px'; c.fillText('LIVE', -28, 2); c.restore(); }
    slam('WATCH LIVE ON', 540, 1300, 110, '#FFFFFF', 0.15, t);
    slam('KICK & TWITCH!', 540, 1440, 132, [['KICK ', KICK], ['& ', '#FFFFFF'], ['TWITCH!', '#A970FF']], 0.45, t);
    tile(kick, '#000', KICK, 400, 1645, 0.85, t, 0);
    tile(twitch, TWI, '#C9A8FF', 680, 1645, 1.0, t, 1);
    // handle types on
    const hp = prog(t, 1.3, 1.9), s = 'Thee_Kal_El', n = Math.round(hp * s.length);
    if (n > 0) { c.save(); c.font = D(64); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 10; c.strokeStyle = '#000'; const txt = s.slice(0, n) + (hp < 1 && Math.floor(t * 8) % 2 ? '|' : '');
      c.strokeText(txt, 540, 1820); c.fillStyle = '#FFFFFF'; c.fillText(txt, 540, 1820); c.restore(); }
    // sparkles drifting up
    for (let i = 0; i < 26; i++) { const st = 0.9 + hash(i, 1) * 3; if (t < st) continue; const age = (t - st) % 2.4, x = 120 + hash(i, 2) * 840, y = 1760 - age * 260, a = Math.sin(age / 2.4 * Math.PI) * 0.9, r = 3 + hash(i, 3) * 5;
      c.fillStyle = i % 2 ? `rgba(83,252,24,${a})` : `rgba(190,150,255,${a})`; c.beginPath(); c.moveTo(x, y - r * 2); c.lineTo(x + r * 0.6, y); c.lineTo(x, y + r * 2); c.lineTo(x - r * 0.6, y); c.closePath(); c.fill(); }
  }
  window.CARD = { FPS, renderAt, ready: Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40)), img('../story/kick_k.png').then((i) => (kick = i)), img('../story/twitch_glitch.png').then((i) => (twitch = i))]) };
})();
</script></body></html>
