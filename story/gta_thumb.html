<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GTA 5 for $10 Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1920" height="1080"></canvas>
<script>
// "GTA 5 FOR $10" — YouTube thumbnail, 1920x1080. Los Santos sunset + palms, a slashed "FULL PRICE" tag, a giant $10 price sticker,
// an eneba-purple cart chip and the creator cutout. All vector (no game art).
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1920, H = 1080, TAU = Math.PI * 2;
  const YEL = '#FFE500', PUR = '#4B1FC2', PINK = '#FF2E88', GRN = '#2BD96B', INK = '#0B0614';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40))]);
  const me = new Image(); me.src = 'kal_cutout.png'; await me.decode();
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function word(s, x, y, size, fill, sx = 0.84, rot = 0, align = 'left', stroke = '#000') {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = 'italic ' + D(size); c.textAlign = align; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(s, 12, 16); c.lineWidth = size * 0.15; c.strokeStyle = stroke; c.strokeText(s, 0, 0);
    if (Array.isArray(fill)) { const g = c.createLinearGradient(0, -size / 2, 0, size / 2); fill.forEach((f, i) => g.addColorStop(i / (fill.length - 1), f)); c.fillStyle = g; } else c.fillStyle = fill; c.fillText(s, 0, 0); c.restore();
  }
  // ---- background: GTA loading-screen style — dark night, diagonal comic panels, halftone, money rain
  let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07090F'); g.addColorStop(1, '#0F1420'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  // diagonal comic panels with thick black borders
  const panelP = (pts, fill) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = 16; c.strokeStyle = '#000'; c.stroke(); };
  g = c.createLinearGradient(0, 0, 900, H); g.addColorStop(0, '#1B5E2A'); g.addColorStop(1, '#0B2A14'); panelP([[-20, -20], [980, -20], [720, 1100], [-20, 1100]], g);
  g = c.createLinearGradient(900, 0, 1500, H); g.addColorStop(0, '#2A1550'); g.addColorStop(1, '#120826'); panelP([[980, -20], [1500, -20], [1240, 1100], [720, 1100]], g);
  g = c.createLinearGradient(1500, 0, W, H); g.addColorStop(0, '#5A1A22'); g.addColorStop(1, '#1E070B'); panelP([[1500, -20], [W + 20, -20], [W + 20, 1100], [1240, 1100]], g);
  // halftone dots per panel
  c.save(); for (let y = 0; y < H; y += 22) for (let x = 0; x < W; x += 22) { const r = 1.5 + 3.5 * (y / H); c.fillStyle = 'rgba(255,255,255,0.06)'; c.beginPath(); c.arc(x + (y / 22 % 2) * 11, y, r, 0, TAU); c.fill(); } c.restore();
  // speed lines radiating from the $10
  c.save(); c.translate(380, 700); for (let i = 0; i < 40; i++) { const a = i / 40 * TAU; c.beginPath(); c.moveTo(Math.cos(a) * 300, Math.sin(a) * 260); c.lineTo(Math.cos(a) * 1400, Math.sin(a) * 1400); c.strokeStyle = 'rgba(255,229,0,0.07)'; c.lineWidth = 14; c.stroke(); } c.restore();
  // raining bills
  const billB = (x, y, w, rot) => { const h = w * 0.45; c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 16; rr(-w / 2, -h / 2, w, h, 6); c.fillStyle = '#7FCB86'; c.fill(); c.shadowColor = 'transparent'; rr(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 4); c.strokeStyle = '#1F6A2C'; c.lineWidth = 3; c.stroke(); c.beginPath(); c.arc(0, 0, h * 0.28, 0, TAU); c.fillStyle = '#C8F0C9'; c.fill(); c.font = D(h * 0.4); c.fillStyle = '#1F6A2C'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', 0, 2); c.restore(); };
  [[880, 60, 140, 0.5], [1300, 420, 110, -0.4], [760, 820, 120, 0.3], [40, 470, 100, -0.6], [1220, 1040, 130, 0.2], [600, 30, 90, -0.2]].forEach(([x, y, w, r]) => billB(x, y, w, r));
  // police lights bleeding in from the edges
  for (const [x, col] of [[0, 'rgba(255,30,60,0.55)'], [W, 'rgba(40,110,255,0.55)']]) { const pg = c.createRadialGradient(x, 0, 0, x, 0, 700); pg.addColorStop(0, col); pg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = pg; c.fillRect(0, 0, W, H); }
  // ---- headline
  word('GTA 5', 60, 200, 300, ['#FFFFFF', '#E8E8E8'], 0.86, -0.04);
  word('FOR ONLY', 70, 410, 120, '#FFFFFF', 0.86, -0.04);
  // giant $10 price sticker
  c.save(); c.translate(380, 700); c.rotate(-0.08); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 40; c.shadowOffsetY = 16;
  c.beginPath(); for (let i = 0; i < 40; i++) { const a = i / 40 * TAU, r = i % 2 ? 230 : 262; c.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r); } c.closePath(); c.fillStyle = YEL; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 12; c.strokeStyle = INK; c.stroke();
  c.font = D(300); c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '-8px'; c.fillStyle = INK; c.fillText('$10', 0, 18); c.restore();
  // slashed FULL PRICE tag
  c.save(); c.translate(850, 500); c.rotate(0.1); rr(-190, -60, 380, 120, 20); c.fillStyle = '#fff'; c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 24; c.fill(); c.shadowColor = 'transparent';
  c.font = D(62); c.fillStyle = '#555'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('FULL PRICE', 0, 4); c.strokeStyle = '#FF1F1F'; c.lineWidth = 14; c.lineCap = 'round'; c.beginPath(); c.moveTo(-170, 30); c.lineTo(170, -24); c.stroke(); c.restore();
  // ONLINE + STORY chip
  c.save(); c.translate(1060, 300); c.rotate(0.04); rr(-230, -52, 460, 104, 52); c.fillStyle = PUR; c.fill(); c.lineWidth = 6; c.strokeStyle = '#fff'; c.stroke();
  c.font = D(52); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('ONLINE + STORY', 0, 3); c.restore();

  // ===== GAME HUD LAYER =====
  // wanted stars + money counter, top right (GTA-style HUD)
  const star = (x, y, r, on) => { c.save(); c.translate(x, y); c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; c.lineTo(Math.cos(a) * q, Math.sin(a) * q); } c.closePath(); c.fillStyle = on ? '#FFFFFF' : 'rgba(0,0,0,0.45)'; c.fill(); c.lineWidth = 5; c.strokeStyle = '#000'; c.stroke(); c.restore(); };
  for (let i = 0; i < 5; i++) star(W - 330 + i * 64, 62, 28, i >= 0);
  c.save(); c.font = 'italic 900 92px "Inter Tight"'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 14; c.strokeStyle = '#000'; c.strokeText('$10', W - 40, 150); c.fillStyle = '#7CFF6B'; c.fillText('$10', W - 40, 150); c.restore();
  // minimap, bottom left corner over the skyline
  c.save(); c.translate(1180, 950); c.beginPath(); c.arc(0, 0, 110, 0, TAU); c.fillStyle = 'rgba(20,30,40,0.92)'; c.fill(); c.clip();
  c.strokeStyle = '#6B7A88'; c.lineWidth = 14; c.beginPath(); c.moveTo(-120, -30); c.lineTo(120, 10); c.moveTo(-20, -120); c.lineTo(20, 120); c.moveTo(-120, 60); c.lineTo(60, -120); c.stroke();
  c.fillStyle = '#3BA34A'; c.fillRect(30, 30, 50, 40); c.fillStyle = '#2C78C9'; c.fillRect(-90, -100, 60, 50);
  c.fillStyle = YEL; c.beginPath(); c.arc(50, -50, 14, 0, TAU); c.fill(); c.font = D(18); c.fillStyle = '#000'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', 50, -49);
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(0, -18); c.lineTo(13, 14); c.lineTo(0, 6); c.lineTo(-13, 14); c.closePath(); c.fill(); c.restore();
  c.beginPath(); c.arc(1180, 950, 110, 0, TAU); c.lineWidth = 8; c.strokeStyle = '#000'; c.stroke();
  // MISSION PASSED banner
  c.save(); c.translate(600, 1010); c.rotate(-0.02); const bg2 = c.createLinearGradient(-420, 0, 420, 0); bg2.addColorStop(0, 'rgba(0,0,0,0)'); bg2.addColorStop(0.15, 'rgba(0,0,0,0.75)'); bg2.addColorStop(0.85, 'rgba(0,0,0,0.75)'); bg2.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = bg2; c.fillRect(-460, -58, 920, 116);
  c.font = 'italic 900 80px "Inter Tight"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 12; c.strokeStyle = '#000'; c.strokeText('MISSION PASSED!', 0, 0); c.fillStyle = '#FFC93A'; c.fillText('MISSION PASSED!', 0, 0); c.restore();
  // controller
  c.save(); c.translate(1110, 640); c.rotate(-0.2); c.scale(0.9, 0.9); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 30;
  c.beginPath(); c.moveTo(-120, -40); c.quadraticCurveTo(0, -70, 120, -40); c.quadraticCurveTo(175, 60, 150, 100); c.quadraticCurveTo(120, 130, 80, 60); c.lineTo(-80, 60); c.quadraticCurveTo(-120, 130, -150, 100); c.quadraticCurveTo(-175, 60, -120, -40); c.closePath(); c.fillStyle = '#1B1B22'; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 6; c.strokeStyle = '#fff'; c.stroke();
  c.fillStyle = '#fff'; c.fillRect(-100, -12, 50, 16); c.fillRect(-83, -29, 16, 50);
  [[80, -28, '#2BD96B'], [104, -4, '#FF3B4E'], [56, -4, '#3B82FF'], [80, 20, '#FFE500']].forEach(([x, y, col]) => { c.beginPath(); c.arc(x, y, 12, 0, TAU); c.fillStyle = col; c.fill(); });
  c.restore();
  // ---- creator cutout with yellow outline
  const ph = 1030, pw = ph * me.width / me.height, px = W - pw + 20, py = H - ph + 60;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(me, px + Math.cos(a / 24 * TAU) * 11, py + Math.sin(a / 24 * TAU) * 11, pw, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(255,229,0,0.8)'; c.shadowBlur = 50; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pw, ph);
  // "NO JOKE!!" burst by his head
  c.save(); c.translate(1080, 135); c.rotate(-0.12); c.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, r = i % 2 ? 82 : 104; c.lineTo(Math.cos(a) * r * 1.95, Math.sin(a) * r); } c.closePath(); c.fillStyle = PINK; c.fill(); c.lineWidth = 7; c.strokeStyle = '#fff'; c.stroke();
  c.font = D(54); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('NO JOKE!!', 0, 3); c.restore();
  for (let i = 0; i < 5; i++) star(W - 330 + i * 64, 62, 28, true);
  c.save(); c.font = 'italic 900 92px "Inter Tight"'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 14; c.strokeStyle = '#000'; c.strokeText('$10', W - 40, 150); c.fillStyle = '#7CFF6B'; c.fillText('$10', W - 40, 150); c.restore();
  document.body.dataset.ready = '1';
})();
</script></body></html>
