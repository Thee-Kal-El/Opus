<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cash App Stablecoins Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// "Cash App now takes STABLECOINS" — YouTube Shorts thumbnail, 1080x1920. Cash App green, giant $ app icon, USDC coins from
// Solana / Ethereum / Polygon / Arbitrum streaming into it and coming out as cash, creator cutout. All vector except the photo.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const CG = '#00D632', CG2 = '#00B12A', INK = '#050805', USDC = '#2775CA', YEL = '#FFE600';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40))]);
  const me = new Image(); me.src = 'kal_cutout.png'; await me.decode();
  const logo = new Image(); logo.src = 'cashapp_logo.png'; await logo.decode();
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  function word(s, x, y, size, fill, sx = 0.86, rot = -0.03, stroke = INK) { c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = D(size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillText(s, 10, 14); c.lineWidth = size * 0.16; c.strokeStyle = stroke; c.strokeText(s, 0, 0); c.fillStyle = fill; c.fillText(s, 0, 0); c.restore(); }
  // ---- background: Cash App green burst
  let g = c.createRadialGradient(W / 2, 900, 0, W / 2, 900, 1300); g.addColorStop(0, '#5BFF7E'); g.addColorStop(0.35, CG); g.addColorStop(1, '#006B18'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(W / 2, 900); for (let i = 0; i < 28; i++) { c.rotate(TAU / 28); if (i % 2) continue; c.beginPath(); c.moveTo(0, 0); c.lineTo(-120, -1700); c.lineTo(120, -1700); c.closePath(); c.fillStyle = 'rgba(255,255,255,0.08)'; c.fill(); } c.restore();
  // faint $ pattern
  c.save(); c.font = D(70); c.fillStyle = 'rgba(0,0,0,0.06)'; c.textAlign = 'center'; c.textBaseline = 'middle'; for (let y = 40; y < H; y += 150) for (let x = 40 + (y / 150 % 2) * 75; x < W; x += 150) c.fillText('$', x, y); c.restore();
  // ---- headline
  word('CASH APP', W / 2, 190, 170, '#FFFFFF');
  word('NOW TAKES', W / 2, 345, 120, '#FFFFFF');
  word('CRYPTO!!', W / 2, 510, 210, YEL);
  // ---- network chips orbiting the icon
  function net(kind, x, y, r) { c.save(); c.translate(x, y); c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 24; c.shadowOffsetY = 8; c.beginPath(); c.arc(0, 0, r, 0, TAU);
    c.fillStyle = { sol: '#000', eth: '#627EEA', poly: '#7B3FE4', arb: '#12233F' }[kind]; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 6; c.strokeStyle = '#fff'; c.stroke();
    if (kind === 'sol') { const gg = c.createLinearGradient(-r, r, r, -r); gg.addColorStop(0, '#9945FF'); gg.addColorStop(1, '#14F195'); c.fillStyle = gg; for (const [dy, dir] of [[-0.32, 1], [0, -1], [0.32, 1]]) { const yy = dy * r, h = r * 0.18, w = r * 1.0, sk = r * 0.2 * dir; c.beginPath(); c.moveTo(-w / 2 + Math.max(0, sk), yy - h / 2); c.lineTo(w / 2 + Math.min(0, sk), yy - h / 2); c.lineTo(w / 2 - Math.max(0, sk), yy + h / 2); c.lineTo(-w / 2 - Math.min(0, sk), yy + h / 2); c.closePath(); c.fill(); } }
    if (kind === 'eth') { const t = -r * 0.6, m = r * 0.05, b = r * 0.62, w = r * 0.38; const f = (pts, col) => { c.beginPath(); pts.forEach(([a, bb], i) => (i ? c.lineTo(a, bb) : c.moveTo(a, bb))); c.closePath(); c.fillStyle = col; c.fill(); }; f([[0, t], [-w, m], [0, m + r * 0.18]], '#fff'); f([[0, t], [w, m], [0, m + r * 0.18]], '#DDE3FF'); f([[0, m + r * 0.28], [-w, m + r * 0.1], [0, b]], '#fff'); f([[0, m + r * 0.28], [w, m + r * 0.1], [0, b]], '#DDE3FF'); }
    if (kind === 'poly') { c.strokeStyle = '#fff'; c.lineWidth = r * 0.14; c.lineJoin = 'round'; const hx = (cx, cy, s) => { c.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + TAU / 12; c.lineTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s); } c.closePath(); c.stroke(); }; hx(-r * 0.2, r * 0.12, r * 0.32); hx(r * 0.2, -r * 0.12, r * 0.32); }
    if (kind === 'arb') { c.strokeStyle = '#28A0F0'; c.lineWidth = r * 0.1; c.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU - TAU / 4; c.lineTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62); } c.closePath(); c.stroke(); c.fillStyle = '#fff'; c.lineWidth = r * 0.14; c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(-r * 0.25, r * 0.35); c.lineTo(r * 0.02, -r * 0.35); c.moveTo(r * 0.05, r * 0.35); c.lineTo(r * 0.3, -r * 0.1); c.stroke(); }
    c.restore(); }
  function usdc(x, y, r, sq = 1) { c.save(); c.translate(x, y); c.scale(sq, 1); c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 20; c.shadowOffsetY = 8; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = USDC; c.fill(); c.shadowColor = 'transparent'; c.strokeStyle = '#fff'; c.lineWidth = r * 0.09; c.beginPath(); c.arc(0, 0, r * 0.72, -1.2, 1.2); c.stroke(); c.beginPath(); c.arc(0, 0, r * 0.72, Math.PI - 1.2, Math.PI + 1.2); c.stroke(); c.font = G(800, r * 1.0); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', 0, r * 0.05); c.restore(); }
  const IC = { x: W / 2, y: 900 };
  // arrows / streams from networks into the icon
  const NETS = [['sol', 150, 760], ['eth', 930, 760], ['poly', 150, 1070], ['arb', 930, 1070]];
  c.save(); c.setLineDash([22, 16]); c.lineWidth = 10; c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineCap = 'round'; for (const [, x, y] of NETS) { c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo((x + IC.x) / 2, y - 40, IC.x + (x < IC.x ? -170 : 170), IC.y + (y < IC.y ? -60 : 60)); c.stroke(); } c.restore();
  NETS.forEach(([k, x, y]) => net(k, x, y, 84));
  [[300, 720, 40, 0.6], [790, 700, 44, 1], [300, 1150, 38, 1], [800, 1140, 42, 0.5]].forEach(([x, y, r, sq]) => usdc(x, y, r, sq));
  // ---- the Cash App icon
  // official Cash App icon (from the app's splash screen, upscaled) with a white sticker border
  c.save(); c.translate(IC.x, IC.y); c.rotate(-0.05); c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 70; c.shadowOffsetY = 24; rr(-200, -200, 400, 400, 104); c.fillStyle = '#fff'; c.fill(); c.shadowColor = 'transparent';
  c.drawImage(logo, -190, -190, 380, 380); c.restore();
  // ---- USDC → $ cash banner
  c.save(); c.translate(W / 2, 1255); c.rotate(-0.03); rr(-470, -78, 940, 156, 78); c.fillStyle = INK; c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 30; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 7; c.strokeStyle = YEL; c.stroke();
  usdc(-375, 0, 52); c.font = D(72); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('USDC', -305, 4);
  c.fillStyle = YEL; c.beginPath(); c.moveTo(-50, -26); c.lineTo(40, -26); c.lineTo(40, -52); c.lineTo(110, 0); c.lineTo(40, 52); c.lineTo(40, 26); c.lineTo(-50, 26); c.closePath(); c.fill();
  c.fillStyle = CG; c.fillText('INSTANT', 140, -16); c.font = D(44); c.fillStyle = '#fff'; c.fillText('CASH', 140, 42); c.restore();
  // ---- creator cutout + green glow (bottom), with a pointing arrow
  const ph = 580, pw = ph * me.width / me.height, px = W / 2 - pw / 2 - 170, py = H - ph + 30;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(me, px + Math.cos(a / 24 * TAU) * 10, py + Math.sin(a / 24 * TAU) * 10, pw, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 50; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pw, ph);
  // "REAL TIME" burst bottom right
  c.save(); c.translate(800, 1640); c.rotate(0.08); c.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, r = i % 2 ? 118 : 146; c.lineTo(Math.cos(a) * r * 1.5, Math.sin(a) * r); } c.closePath(); c.fillStyle = YEL; c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 26; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 8; c.strokeStyle = INK; c.stroke();
  c.font = D(48); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('SPEND IT', 0, -26); c.fillText('INSTANTLY!', 0, 30); c.restore();
  document.body.dataset.ready = '1';
})();
</script></body></html>
