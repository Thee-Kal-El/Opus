<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DreamLabs Shorts Thumbnail</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// DreamLabs YouTube Shorts thumbnail, 1080x1920, in the site's own look: pixel-art sunset (from the recording),
// warm cream/yellow, rounded cards, little blob mascots; "I PROMPTED A REAL ROBOT!" + the robot arms + Kal's cutout.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const INK = '#151515', CREAM = '#FFF7E0', YEL = '#FFD43B', ORANGE = '#FFB070', MUTE = '#6E6A60';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`, M = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(600, 40)), document.fonts.load(G(800, 40)), document.fonts.load(M(700, 30))]);
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const [sun, arms, me, rebot, dlLogo] = await Promise.all([img('sunset.png'), img('robot_arms.png'), img('kal_cut.png'), img('robot_rebot.png'), img('dreamlabs_logo_black.png')]);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  // poster word: thick dark stroke + soft drop + fill
  const word = (s, x, y, size, fill, rot = 0, sx = 0.88, white = false) => { c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = D(size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    if (white) { c.save(); c.shadowColor = 'rgba(60,30,0,0.35)'; c.shadowBlur = 24; c.shadowOffsetY = 10; c.lineWidth = size * 0.48; c.strokeStyle = '#FFFFFF'; c.strokeText(s, 0, 0); c.restore(); c.strokeStyle = '#FFFFFF'; for (const k of [0.48, 0.42, 0.36, 0.3, 0.24, 0.18, 0.12]) { c.lineWidth = size * k; c.strokeText(s, 0, 0); } } else { c.fillStyle = 'rgba(60,30,0,0.35)'; c.fillText(s, 8, 14); c.lineWidth = size * 0.16; c.strokeStyle = INK; c.strokeText(s, 0, 0); }
    if (Array.isArray(fill)) { const g = c.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]); c.fillStyle = g; } else c.fillStyle = fill; c.fillText(s, 0, 0); c.restore(); };
  // the site's blob mascots: soft rounded bodies with two dot eyes
  const blob = (x, y, s, col, rot = 0, kind = 0) => { c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(80,50,0,0.18)'; c.shadowBlur = 20; c.shadowOffsetY = 8; c.fillStyle = col; c.beginPath();
    if (kind === 0) { c.ellipse(0, 0, s * 1.35, s * 0.8, 0, 0, TAU); c.ellipse(-s * 0.5, -s * 0.55, s * 0.45, s * 0.38, 0, 0, TAU); c.ellipse(s * 0.45, -s * 0.6, s * 0.5, s * 0.4, 0, 0, TAU); }
    else if (kind === 1) { for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.moveTo(Math.cos(a) * s * 0.55 + s * 0.5, Math.sin(a) * s * 0.55); c.arc(Math.cos(a) * s * 0.55, Math.sin(a) * s * 0.55, s * 0.5, 0, TAU); } c.arc(0, 0, s * 0.7, 0, TAU); }
    else { c.ellipse(0, s * 0.1, s * 0.75, s * 0.9, 0, 0, TAU); c.ellipse(0, -s * 0.6, s * 0.35, s * 0.35, 0, 0, TAU); }
    c.fill(); c.shadowColor = 'transparent'; c.fillStyle = kind === 0 ? '#fff' : '#1a1a1a'; c.beginPath(); c.arc(-s * 0.28, 0, s * 0.16, 0, TAU); c.arc(s * 0.28, 0, s * 0.16, 0, TAU); c.fill(); c.restore(); };

  // ---- background: warm cream → yellow, dot grid
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#FFF3D4'); bg.addColorStop(0.55, CREAM); bg.addColorStop(1, '#FDE7A0'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(150,110,30,0.10)'; for (let y = 14; y < H; y += 34) for (let x = 14; x < W; x += 34) { c.beginPath(); c.arc(x, y, 2.2, 0, TAU); c.fill(); }
  // ---- pixel-art sunset band (from DreamLabs' homepage), rounded like the site's hero card
  const bx = 36, by = 40, bw = W - 72, bh = 540; c.save(); c.shadowColor = 'rgba(120,60,20,0.3)'; c.shadowBlur = 40; c.shadowOffsetY = 16; rr(bx, by, bw, bh, 40); c.fillStyle = '#F8B98A'; c.fill(); c.restore();
  c.save(); rr(bx, by, bw, bh, 40); c.clip(); const sc = Math.max(bw / sun.width, bh / sun.height); c.imageSmoothingQuality = 'high'; c.drawImage(sun, bx + (bw - sun.width * sc) / 2, by + (bh - sun.height * sc) / 2, sun.width * sc, sun.height * sc);
  const fade = c.createLinearGradient(0, by + bh * 0.5, 0, by + bh); fade.addColorStop(0, 'rgba(255,230,190,0)'); fade.addColorStop(1, 'rgba(255,214,150,0.55)'); c.fillStyle = fade; c.fillRect(bx, by, bw, bh); c.restore();
  // ---- the Dream Labs logo (cloud mark + wordmark) + tagline, big in the sunset card
  c.save(); rr(bx, by, bw, bh, 40); c.clip();
  { const lw = 760, lh = lw * dlLogo.height / dlLogo.width; c.save(); c.shadowColor = 'rgba(255,240,215,0.7)'; c.shadowBlur = 30; c.drawImage(dlLogo, W / 2 - lw / 2, by + 205 - lh / 2, lw, lh); c.restore(); }
  c.font = M(700, 30); c.fillStyle = '#111111'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = 'rgba(255,240,215,0.8)'; c.shadowBlur = 14; c.fillText('ROBOTICS WITHIN REACH', W / 2, by + 305); c.shadowBlur = 0;
  c.restore();
  // ---- headline (crosses the bottom edge of the sunset card)
  word('I PROMPTED A', W / 2, 555, 120, ['#FF6A3D', '#E5341B'], -0.03, 0.88, true);
  word('REAL ROBOT!', W / 2, 745, 172, ['#FF6A3D', '#E5341B'], -0.03, 0.84, true);
  // ---- robot card (the arms from the site) with the site's playground chip
  c.save(); c.translate(780, 1150); c.rotate(0.05); const cw = 540, ch = 440;
  c.shadowColor = 'rgba(120,80,10,0.35)'; c.shadowBlur = 50; c.shadowOffsetY = 20; rr(-cw / 2, -ch / 2, cw, ch, 36); c.fillStyle = '#FDEFB4'; c.fill(); c.shadowColor = 'transparent';
  c.save(); rr(-cw / 2, -ch / 2, cw, ch, 36); c.clip(); const as = Math.max(cw / arms.width, ch / arms.height); c.drawImage(arms, -arms.width * as / 2, -ch / 2, arms.width * as, arms.height * as); c.restore();
  c.lineWidth = 6; c.strokeStyle = '#fff'; rr(-cw / 2, -ch / 2, cw, ch, 36); c.stroke();
  rr(-cw / 2 + 26, ch / 2 - 86, 330, 62, 31); c.fillStyle = INK; c.fill(); c.font = M(700, 26); c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText('ROBOT PLAYGROUND', -cw / 2 + 52, ch / 2 - 54);
  c.restore();
  // ---- second robot card (the reBot arm from the site), tilted the other way
  c.save(); c.translate(800, 1575); c.rotate(-0.06); const cw2 = 430, ch2 = 270;
  c.shadowColor = 'rgba(120,80,10,0.35)'; c.shadowBlur = 44; c.shadowOffsetY = 18; rr(-cw2 / 2, -ch2 / 2, cw2, ch2, 30); c.fillStyle = '#FDEFB4'; c.fill(); c.shadowColor = 'transparent';
  c.save(); rr(-cw2 / 2, -ch2 / 2, cw2, ch2, 30); c.clip(); const rs = Math.max(cw2 / rebot.width, ch2 / rebot.height); c.drawImage(rebot, -rebot.width * rs / 2, -rebot.height * rs / 2, rebot.width * rs, rebot.height * rs); c.restore();
  c.lineWidth = 6; c.strokeStyle = '#fff'; rr(-cw2 / 2, -ch2 / 2, cw2, ch2, 30); c.stroke();
  c.restore();
  // ---- blob mascots
  blob(585, 1430, 40, ORANGE, -0.12, 0); blob(140, 900, 40, '#7ED9A0', 0.1, 1); blob(985, 880, 34, '#8EC5FF', 0, 2); blob(520, 930, 30, '#FF9AA8', 0.2, 1);
  // ---- Kal cutout with a white sticker outline + warm glow
  const ph = 960, pwid = ph * me.width / me.height, px = -40, py = H - ph;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(me, px + Math.cos(a / 24 * TAU) * 13, py + Math.sin(a / 24 * TAU) * 13, pwid, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(140,80,10,0.55)'; c.shadowBlur = 60; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pwid, ph);
  // ---- bottom pill, like the site's buttons
  c.save(); c.translate(W - 270, H - 120); rr(-220, -52, 440, 104, 52); c.fillStyle = INK; c.fill(); c.font = G(700, 40); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('Prompt a robot  →', 0, 2); c.restore();
  document.body.dataset.ready = '1';
})();
</script></body></html>
