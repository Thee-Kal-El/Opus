<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Anaheim Card Show Thumbnail</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// YouTube thumbnail (1280×720): Kal vending 3D prints, trading cards and comics at the Anaheim Card Show holiday shows.
// Christmas look: garland + lights, candy-cane border, tree, snow; Kal's real products as cutouts.
let DATES;
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const GOLD = ['#FFE7A3', '#E9B949', '#A8761C'], RED = '#E02424', INK = '#0A0A0A';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, SER = (s) => `italic 400 ${s}px "Instrument Serif", serif`, M = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(SER(80)), document.fonts.load(M(800, 30))]);
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const me = await img('kal_cut.png');
  let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const gold = (y0, y1) => { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, GOLD[0]); g.addColorStop(0.5, GOLD[1]); g.addColorStop(1, GOLD[2]); return g; };
  const word = (s, x, y, size, fill, font = D, rot = -0.02, align = 'left') => { c.save(); c.translate(x, y); c.rotate(rot); c.font = font(size); c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.save(); c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 20; c.shadowOffsetY = 8; c.lineWidth = size * 0.22; c.strokeStyle = INK; c.strokeText(s, 0, 0); c.restore();
    c.lineWidth = size * 0.22; c.strokeStyle = INK; c.strokeText(s, 0, 0); c.fillStyle = typeof fill === 'string' ? fill : gold(-size / 2, size / 2); c.fillText(s, 0, 0); c.restore(); };

  // ---- background: deep red glow, green edges, multicolour bokeh
  const bg = c.createRadialGradient(540, 900, 40, 540, 900, 1300); bg.addColorStop(0, '#4A0D0D'); bg.addColorStop(0.45, '#1C0707'); bg.addColorStop(1, '#03100A'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const BOK = ['255,70,70', '80,220,120', '255,200,90', '255,255,255', '110,170,255'];
  for (let i = 0; i < 40; i++) { const x = rnd() * W, y = 300 + rnd() * 1600, r = 12 + rnd() * 46, col = BOK[i % 5], g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${0.22 + rnd() * 0.25})`); g.addColorStop(1, `rgba(${col},0)`); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  // snow drifts along the bottom
  const drift = (y0, amp, col) => { c.beginPath(); c.moveTo(0, H); for (let x = 0; x <= W; x += 20) c.lineTo(x, y0 + Math.sin(x / 140) * amp + Math.sin(x / 57) * amp * 0.4); c.lineTo(W, H); c.closePath(); c.fillStyle = col; c.fill(); };
  // ---- products: background-removed cutouts with a warm glow
  const P = {}; for (const n of ['gameboy','alien','barbatos','cardinal','psa','steelers']) P[n] = await img('c_' + n + '.png');
  const item = (im, x, y, w, rot) => { const h = w * im.height / im.width; c.save(); c.translate(x, y); c.rotate(rot);
    c.shadowColor = 'rgba(255,220,150,0.55)'; c.shadowBlur = 40; c.drawImage(im, -w / 2, -h / 2, w, h);
    c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 26; c.shadowOffsetY = 16; c.drawImage(im, -w / 2, -h / 2, w, h); c.restore(); };
  // Christmas tree (left)
  const tree = (x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = '#5A3418'; c.fillRect(-18, 150, 36, 46);
    [[-30, 130, 70], [-100, 75, 105], [-170, 15, 135]].forEach(([t, bw]) => {});
    const tiers = [[-190, -40, 80], [-120, 40, 115], [-50, 150, 150]];
    tiers.forEach(([t, bt, hw]) => { c.beginPath(); c.moveTo(0, t); c.lineTo(hw, bt); c.quadraticCurveTo(0, bt + 22, -hw, bt); c.closePath(); const g = c.createLinearGradient(-hw, 0, hw, 0); g.addColorStop(0, '#0D5A2A'); g.addColorStop(0.5, '#1E8C43'); g.addColorStop(1, '#0A4520'); c.fillStyle = g; c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 20; c.fill(); c.shadowBlur = 0; });
    // tinsel + lights
    c.strokeStyle = '#F5D36B'; c.lineWidth = 4; [[-130, -60, 50, -10], [-95, 25, 80, 70], [-125, 95, 120, 140]].forEach(([x0, y0, x1, y1]) => { c.beginPath(); c.moveTo(x0 * 0.6, y0); c.quadraticCurveTo(0, (y0 + y1) / 2 + 26, x1 * 0.85, y1); c.stroke(); });
    const LC = ['#FF3B3B', '#FFD34D', '#4DA3FF', '#FFFFFF', '#FF7AD9'];
    for (let i = 0; i < 22; i++) { const t = rnd(), yy = -170 + t * 300, hw = 20 + t * 120, xx = (rnd() * 2 - 1) * hw * 0.8; c.fillStyle = LC[i % 5]; c.shadowColor = LC[i % 5]; c.shadowBlur = 16; c.beginPath(); c.arc(xx, yy, 7, 0, TAU); c.fill(); }
    c.shadowBlur = 0;
    // star
    c.save(); c.translate(0, -195); c.shadowColor = '#FFD34D'; c.shadowBlur = 30; c.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 16 : 38, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fillStyle = gold(-38, 38); c.fill(); c.restore();
    c.restore(); };
  tree(165, 1265, 1.0);
  item(P.alien, 205, 810, 400, -0.06);
  item(P.barbatos, 875, 800, 330, 0.1);
  item(P.gameboy, 545, 820, 330, 0.02);
  item(P.psa, 935, 1250, 240, 0.07);
  // ---- headline (top-left)
  c.font = M(800, 30); c.fillStyle = GOLD[0]; c.textBaseline = 'middle'; c.textAlign = 'center'; c.letterSpacing = '6px'; c.fillText('ANAHEIM CARD SHOW', W / 2, 175); c.font = M(800, 24); c.fillText('★ HOLIDAY SHOW ★', W / 2, 217); c.letterSpacing = '0px'; c.textAlign = 'left';
  c.fillStyle = gold(241, 245); c.fillRect(W / 2 - 300, 245, 600, 3);
  word("I'M VENDING!", W / 2, 350, 156, '#FFFFFF', D, -0.02, 'center');
  word('3D Prints · Cards · Comics', W / 2, 475, 84, null, SER, -0.02, 'center');
  // ---- dates pill
    DATES = () => { c.save(); rr(W / 2 - 400, 1740, 800, 96, 48); c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 24; c.fillStyle = '#B3121B'; c.fill(); c.shadowBlur = 0; c.lineWidth = 6; c.strokeStyle = gold(1740, 1836); c.stroke(); c.font = M(800, 40); c.fillStyle = '#FFF4D6'; c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillText('NOV 25 · 11AM-6PM · ANAHEIM', W / 2, 1790); c.restore(); };

  // ---- Kal (right), white sticker outline
  const ph = 900, pw = ph * me.width / me.height, px = (W - pw) / 2 + 30, py = H - ph + 20;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 28; a++) o.drawImage(me, px + Math.cos(a / 28 * TAU) * 12, py + Math.sin(a / 28 * TAU) * 12, pw, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(233,185,73,0.6)'; c.shadowBlur = 50; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pw, ph);

  // items over the elbows
  item(P.steelers, 225, 1610, 400, -0.08);
  item(P.cardinal, 880, 1560, 240, 0.1);
  drift(1850, 14, '#E8F1FF'); drift(1880, 10, '#FFFFFF');
  DATES();
  // ---- pine garland + string lights across the top
  const gy = (x) => 38 + Math.sin(x / W * Math.PI) * 34;
  for (let i = 0; i < 900; i++) { const x = rnd() * W, y = gy(x) + (rnd() - 0.5) * 38, a = rnd() * TAU, l = 18 + rnd() * 22; c.strokeStyle = ['#0B4A22', '#13662F', '#1F8A3F', '#0E3D1D'][i % 4]; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
  const LC2 = ['#FF3B3B', '#FFD34D', '#3DFF8A', '#4DA3FF', '#FF7AD9'];
  for (let i = 0; i < 18; i++) { const x = 30 + i * 60, y = gy(x) + 22; c.save(); c.translate(x, y); c.rotate((i % 2 ? 0.3 : -0.3)); c.fillStyle = '#333'; c.fillRect(-5, -10, 10, 10); c.shadowColor = LC2[i % 5]; c.shadowBlur = 28; c.fillStyle = LC2[i % 5]; c.beginPath(); c.ellipse(0, 10, 9, 15, 0, 0, TAU); c.fill(); c.fill(); c.restore(); }
  // ornaments hanging off the garland
  const orn = (x, len, r, c1, c2) => { const y = gy(x) + len; c.strokeStyle = '#E9B949'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, gy(x)); c.lineTo(x, y - r); c.stroke(); c.save(); c.shadowColor = c1; c.shadowBlur = 25; const g = c.createRadialGradient(x - r / 3, y - r / 3, 3, x, y, r); g.addColorStop(0, c1); g.addColorStop(1, c2); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.restore(); c.fillStyle = gold(y - r - 12, y - r); c.fillRect(x - 9, y - r - 10, 18, 12); c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.ellipse(x - r / 3, y - r / 2.5, r / 4, r / 7, -0.6, 0, TAU); c.fill(); };
  orn(70, 120, 32, '#FF6B6B', '#7A0A0A'); orn(1010, 110, 34, '#5BE38A', '#0B4A22'); orn(150, 70, 22, '#FFE38A', '#9A6A10'); orn(930, 64, 24, '#FF6B6B', '#7A0A0A');
  // holly sprigs by the label
  const holly = (x, y, fl) => { c.save(); c.translate(x, y); c.scale(fl, 1); [[-0.5], [0.4]].forEach(([a]) => { c.save(); c.rotate(a); c.beginPath(); c.moveTo(0, 0); for (let i = 0; i <= 6; i++) { c.lineTo(i * 9, -((i % 2) ? 12 : 4) - Math.sin(i / 6 * Math.PI) * 6); } for (let i = 6; i >= 0; i--) { c.lineTo(i * 9, ((i % 2) ? 12 : 4) + Math.sin(i / 6 * Math.PI) * 6); } c.closePath(); c.fillStyle = '#1C8A3E'; c.fill(); c.restore(); });
    ['#E0242A', '#FF3B3B', '#B3121B'].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(-4 + i * 9, -6 + (i % 2) * 10, 8, 0, TAU); c.fill(); }); c.restore(); };
  holly(215, 195, -1); holly(865, 195, 1);
  // candy-cane border
  c.save(); c.beginPath(); c.rect(0, 0, W, H); c.rect(18, 18, W - 36, H - 36); c.clip('evenodd'); c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, W, H); c.fillStyle = '#D0141E'; for (let t = -H; t < W + H; t += 44) { c.beginPath(); c.moveTo(t, 0); c.lineTo(t + 22, 0); c.lineTo(t + 22 + H, H); c.lineTo(t + H, H); c.closePath(); c.fill(); } c.restore();
  // ---- snow over everything
  for (let i = 0; i < 300; i++) { const x = rnd() * W, y = rnd() * H, r = 0.8 + rnd() * 2.6; c.fillStyle = `rgba(255,255,255,${0.35 + rnd() * 0.55})`; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  document.body.dataset.ready = '1';
})();
</script></body></html>
