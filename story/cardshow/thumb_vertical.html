<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Anaheim Card Show Thumbnail</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// YouTube thumbnail (1280×720): Kal vending 3D prints, trading cards and comics at the Anaheim Card Show holiday shows.
// Black + gold holiday look to match the show's flyer; products are drawn stand-ins.
let DATES;
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const GOLD = ['#FFE7A3', '#E9B949', '#A8761C'], RED = '#E02424', INK = '#0A0A0A';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, SER = (s) => `italic 400 ${s}px "Instrument Serif", serif`, M = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(SER(80)), document.fonts.load(M(800, 30))]);
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const me = await img('kal_cut.png');
  let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const gold = (y0, y1) => { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, GOLD[0]); g.addColorStop(0.5, GOLD[1]); g.addColorStop(1, GOLD[2]); return g; };
  const word = (s, x, y, size, fill, font = D, rot = -0.02, align = 'left') => { c.save(); c.translate(x, y); c.rotate(rot); c.font = font(size); c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.save(); c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 20; c.shadowOffsetY = 8; c.lineWidth = size * 0.22; c.strokeStyle = INK; c.strokeText(s, 0, 0); c.restore();
    c.lineWidth = size * 0.22; c.strokeStyle = INK; c.strokeText(s, 0, 0); c.fillStyle = typeof fill === 'string' ? fill : gold(-size / 2, size / 2); c.fillText(s, 0, 0); c.restore(); };

  // ---- background: black with warm bokeh lights + falling snow
  const bg = c.createRadialGradient(540, 760, 40, 540, 760, 1400); bg.addColorStop(0, '#2A1A08'); bg.addColorStop(0.5, '#0E0A06'); bg.addColorStop(1, '#000'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) { const x = rnd() * W, y = 500 + rnd() * 1400, r = 14 + rnd() * 44, g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,${170 + rnd() * 60 | 0},80,${0.25 + rnd() * 0.3})`); g.addColorStop(1, 'rgba(255,160,60,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  // gold floor reflection
  const fl = c.createLinearGradient(0, 1500, 0, H); fl.addColorStop(0, 'rgba(233,185,73,0)'); fl.addColorStop(1, 'rgba(233,185,73,0.3)'); c.fillStyle = fl; c.fillRect(0, 1500, W, 420);

  // ---- products: Kal's real items as tilted white-framed photo cards
  const P = {}; for (const n of ['gameboy','alien','barbatos','cardinal','psa','steelers']) P[n] = await img('p_' + n + '.jpg');
  const photo = (im, x, y, w, rot, tag) => { const h = w * im.height / im.width, f = 14; c.save(); c.translate(x, y); c.rotate(rot);
    c.shadowColor = 'rgba(0,0,0,0.75)'; c.shadowBlur = 34; c.shadowOffsetY = 14; rr(-w / 2 - f, -h / 2 - f, w + 2 * f, h + 2 * f + (tag ? 40 : 0), 10); c.fillStyle = '#FBF7EE'; c.fill(); c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.drawImage(im, -w / 2, -h / 2, w, h);
    if (tag) { c.font = M(800, 24); c.fillStyle = '#1A1206'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(tag, 0, h / 2 + f + 8); }
    c.restore(); };
  photo(P.alien, 215, 760, 330, -0.11, '3D PRINTS');
  photo(P.barbatos, 870, 740, 320, 0.09, 'CUSTOM PLAQUES');
  photo(P.cardinal, 150, 1250, 250, -0.07, null);
  photo(P.psa, 935, 1260, 200, 0.08, null);
  photo(P.steelers, 200, 1590, 320, 0.05, null);
  photo(P.gameboy, 545, 770, 330, 0.03, null);

  // ---- headline (top-left)
  c.font = M(800, 30); c.fillStyle = GOLD[0]; c.textBaseline = 'middle'; c.textAlign = 'center'; c.letterSpacing = '6px'; c.fillText('ANAHEIM CARD SHOW', W / 2, 120); c.font = M(800, 24); c.fillText('HOLIDAY SHOWS', W / 2, 162); c.letterSpacing = '0px'; c.textAlign = 'left';
  c.fillStyle = gold(186, 190); c.fillRect(W / 2 - 300, 190, 600, 3);
  word("I'M VENDING!", W / 2, 300, 156, '#FFFFFF', D, -0.02, 'center');
  word('3D Prints · Cards · Comics', W / 2, 430, 84, null, SER, -0.02, 'center');
  // ---- dates pill
    DATES = () => { c.save(); rr(W / 2 - 330, 1770, 660, 80, 40); c.fillStyle = INK; c.fill(); c.lineWidth = 4; c.strokeStyle = gold(1770, 1850); c.stroke(); c.font = M(800, 34); c.fillStyle = '#FFE7A3'; c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillText('NOV 25 & NOV 27 · ANAHEIM, CA', W / 2, 1811); c.restore(); };
  // ---- ornament
  c.save(); c.translate(960, 110); c.shadowColor = 'rgba(224,36,36,0.7)'; c.shadowBlur = 30; const og = c.createRadialGradient(-12, -12, 4, 0, 0, 46); og.addColorStop(0, '#FF8080'); og.addColorStop(1, '#8E0E0E'); c.beginPath(); c.arc(0, 20, 46, 0, TAU); c.fillStyle = og; c.fill(); c.shadowBlur = 0; c.fillStyle = gold(-40, -20); c.fillRect(-12, -36, 24, 16); c.strokeStyle = '#E9B949'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -36); c.lineTo(0, -70); c.stroke(); c.restore();

  // ---- Kal (right), white sticker outline
  const ph = 900, pw = ph * me.width / me.height, px = (W - pw) / 2 + 30, py = H - ph + 20;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 28; a++) o.drawImage(me, px + Math.cos(a / 28 * TAU) * 12, py + Math.sin(a / 28 * TAU) * 12, pw, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(233,185,73,0.6)'; c.shadowBlur = 50; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pw, ph);

  DATES();
  // ---- snow over everything
  for (let i = 0; i < 300; i++) { const x = rnd() * W, y = rnd() * H, r = 0.8 + rnd() * 2.6; c.fillStyle = `rgba(255,255,255,${0.35 + rnd() * 0.55})`; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  document.body.dataset.ready = '1';
})();
</script></body></html>
