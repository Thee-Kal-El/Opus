<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PUBG OOOO Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// PUBG "OOOO" — vertical cover/thumbnail, 1080x1920, built from frames of the clip: the 8x scope at the moment of the hit
// (blood puff over the kneeling enemy) blown up as a giant lens under a giant “OOOO” quote, and a KICK + TWITCH strip. All text sits above y≈1450 and left of the right-side app buttons.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const YEL = '#FFE500', KICK = '#53FC18', TWI = '#9146FF', RED = '#FF2A2A', INK = '#06070A';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40))]);
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const [me, scope, field, kick, twitch] = await Promise.all([img('kal_reaction_sticker.png'), img('../thumb/s_1.00_scope_x4.png'), img('../thumb/pubg_6.6.jpg'), img('kick_k.png'), img('twitch_glitch.png')]);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function word(s, x, y, size, fill, rot = 0, align = 'center', sx = 0.9, ital = true) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = (ital ? 'italic ' : '') + D(size); c.textAlign = align; c.textBaseline = 'middle'; c.letterSpacing = '-3px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillText(s, 10, 14); c.lineWidth = size * 0.17; c.strokeStyle = '#000'; c.strokeText(s, 0, 0);
    if (Array.isArray(fill)) { const g = c.createLinearGradient(0, -size / 2, 0, size / 2); fill.forEach((f, i) => g.addColorStop(i / (fill.length - 1), f)); c.fillStyle = g; } else c.fillStyle = fill; c.fillText(s, 0, 0); c.restore();
  }

  // ---- background: the open field from the clip, blurred + graded dark, red heat behind the scope
  c.save(); c.filter = 'blur(10px) brightness(0.45) saturate(1.2)'; c.drawImage(field, 0, 560, 918, 1072, -60, -40, W + 120, H + 80); c.restore();
  let g = c.createRadialGradient(540, 960, 120, 540, 960, 950); g.addColorStop(0, 'rgba(255,40,30,0.38)'); g.addColorStop(0.5, 'rgba(120,10,10,0.15)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  g = c.createLinearGradient(0, 1400, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)'); c.fillStyle = g; c.fillRect(0, 1400, W, 520);
  // speed lines out of the lens
  c.save(); c.translate(540, 960); for (let i = 0; i < 46; i++) { const a = i / 46 * TAU + 0.03; c.beginPath(); c.moveTo(Math.cos(a) * 530, Math.sin(a) * 530); c.lineTo(Math.cos(a) * 1500, Math.sin(a) * 1500); c.strokeStyle = i % 2 ? 'rgba(255,229,0,0.10)' : 'rgba(255,255,255,0.05)'; c.lineWidth = 10 + (i % 3) * 6; c.stroke(); } c.restore();

  // ---- the scope: source circle centre (466,1064) r≈296 → drawn centred at (540,960) r=500, with a heavy black tube ring
  const CX = 540, CY = 960, R = 500, k = R / 296;
  c.save(); c.shadowColor = 'rgba(255,40,30,0.9)'; c.shadowBlur = 70; c.beginPath(); c.arc(CX, CY, R + 34, 0, TAU); c.fillStyle = '#0A0A0A'; c.fill(); c.restore();
  c.save(); c.beginPath(); c.arc(CX, CY, R, 0, TAU); c.clip();
  // scope plate: Real-ESRGAN x4 of the source crop (150,748)-(790,1388), so 1 source px = 4 plate px
  c.filter = 'contrast(1.12) saturate(1.3) brightness(1.06)'; c.drawImage(scope, CX - (466 - 150) * k, CY - (1064 - 748) * k, 640 * k, 640 * k); c.filter = 'none';
  // lens vignette + glass sheen
  g = c.createRadialGradient(CX, CY, R * 0.6, CX, CY, R); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); c.fillStyle = g; c.fillRect(CX - R, CY - R, 2 * R, 2 * R);
  g = c.createLinearGradient(CX - R, CY - R, CX + R, CY + R); g.addColorStop(0, 'rgba(255,255,255,0.12)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(CX - R, CY - R, 2 * R, 2 * R);
  c.restore();
  c.beginPath(); c.arc(CX, CY, R + 12, 0, TAU); c.lineWidth = 26; c.strokeStyle = '#151515'; c.stroke();
  c.beginPath(); c.arc(CX, CY, R + 30, 0, TAU); c.lineWidth = 6; c.strokeStyle = RED; c.stroke();
  // the hit: blood puff over the kneeling enemy at source (480,1004)
  const hx = CX + (480 - 466) * k, hy = CY + (1004 - 1064) * k;
  // arrow from the headline into the hit
  c.save(); c.strokeStyle = YEL; c.fillStyle = YEL; c.lineWidth = 14; c.lineCap = 'round'; c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 12;
  c.beginPath(); c.moveTo(985, 470); c.quadraticCurveTo(880, 640, hx + 98, hy - 50); c.stroke();
  const ang = Math.atan2(hy - 50 - 640, hx + 98 - 880); c.translate(hx + 98, hy - 50); c.rotate(ang); c.beginPath(); c.moveTo(14, 0); c.lineTo(-38, -26); c.lineTo(-38, 26); c.closePath(); c.fill(); c.restore();

  // ---- headline
  word('“OOOO”', 540, 330, 215, ['#FFFFFF', '#FFF4A8', YEL, '#FFB800'], -0.06, 'center', 1.12, false);

  // ---- reaction: Kal cut out with a sticker border, bottom-right, looking across at the kill (bottom edge tucks under the pill)
  { const mw = 640, mh = mw * me.height / me.width, off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
    o.save(); o.shadowColor = 'rgba(0,0,0,0.75)'; o.shadowBlur = 40; o.translate(W - mw + 70, 1125); o.rotate(0.04); o.drawImage(me, 0, 0, mw, mh); o.restore();
    // fade the flat bottom edge out so it melts into the dark under the pill
    const fg = o.createLinearGradient(0, 1600, 0, 1730); fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,1)'); o.globalCompositeOperation = 'destination-out'; o.fillStyle = fg; o.fillRect(0, 1600, W, H - 1600);
    c.drawImage(off, 0, 0); }
  // ---- KICK + TWITCH pill, centred under the scope
  const sy = 1570, px = 60, pw = 960, ph = 190; rr(px, sy, pw, ph, ph / 2); c.fillStyle = 'rgba(8,9,12,0.9)'; c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 30; c.fill(); c.shadowBlur = 0;
  c.lineWidth = 6; g = c.createLinearGradient(px, 0, px + pw, 0); g.addColorStop(0, KICK); g.addColorStop(1, TWI); c.strokeStyle = g; c.stroke();
  c.save(); rr(px + 40, sy + 30, 130, 130, 28); c.fillStyle = '#000'; c.fill(); c.lineWidth = 4; c.strokeStyle = KICK; c.stroke(); c.drawImage(kick, px + 62, sy + 45, 86, 100); c.restore();
  c.save(); rr(px + 190, sy + 30, 130, 130, 28); c.fillStyle = TWI; c.fill(); c.drawImage(twitch, px + 214, sy + 43, 82, 104); c.restore();
  c.font = G(800, 40); c.fillStyle = '#B4BAC2'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.letterSpacing = '4px'; c.fillText('LIVE ON KICK + TWITCH', px + 355, sy + 62);
  c.font = D(78); c.fillStyle = '#FFFFFF'; c.letterSpacing = '0px'; c.fillText('Thee_Kal_El', px + 352, sy + 128);
  // PUBG tag, centred and big
  rr(375, 60, 330, 110, 20); c.fillStyle = '#F2A900'; c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 20; c.fill(); c.shadowBlur = 0; c.lineWidth = 6; c.strokeStyle = '#000'; c.stroke();
  c.font = D(84); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '2px'; c.fillText('PUBG', 540, 118);
  document.title = 'done';
})();
</script></body></html>
