<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LimeWire AI Studio Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1920" height="1080"></canvas>
<script>
// "FREE LIMEWIRE AI STUDIO FOR LIFE!!" — YouTube thumbnail, 1920x1080. New background: dark lime "AI studio" space with a glowing grid,
// floating AI-generation tiles and sparkles; vector lime slice; the LMWR character cut out and upscaled from the old thumbnail.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1920, H = 1080, TAU = Math.PI * 2;
  const LIME = '#B8F02A', GRN = '#3FBF2A', DG = '#06170A', YEL = '#F5F23A', INK = '#031006';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40))]);
  const girl = new Image(); girl.src = 'lmwr_girl_ext.png'; await girl.decode();
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  // ---- background: deep green space, perspective grid floor, glow
  let g = c.createRadialGradient(760, 420, 0, 760, 420, 1400); g.addColorStop(0, '#1C5A12'); g.addColorStop(0.5, '#0A2A0C'); g.addColorStop(1, '#020804'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.strokeStyle = 'rgba(184,240,42,0.18)'; c.lineWidth = 2; const hz = 640;
  for (let i = -20; i <= 20; i++) { c.beginPath(); c.moveTo(760 + i * 40, hz); c.lineTo(760 + i * 260, H + 40); c.stroke(); }
  for (let j = 0; j < 12; j++) { const y = hz + Math.pow(j / 11, 2) * (H - hz + 40); c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } c.restore();
  g = c.createLinearGradient(0, hz - 140, 0, hz + 60); g.addColorStop(0, 'rgba(184,240,42,0)'); g.addColorStop(0.7, 'rgba(184,240,42,0.25)'); g.addColorStop(1, 'rgba(184,240,42,0)'); c.fillStyle = g; c.fillRect(0, hz - 140, W, 200);
  // floating "AI generation" tiles (abstract generated-art gradients)
  function tile(x, y, w, rot, a, b, kind) { const h = w; c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(184,240,42,0.6)'; c.shadowBlur = 40; rr(-w / 2, -h / 2, w, h, 18); const gg = c.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); gg.addColorStop(0, a); gg.addColorStop(1, b); c.fillStyle = gg; c.fill(); c.shadowColor = 'transparent';
    c.save(); rr(-w / 2, -h / 2, w, h, 18); c.clip(); c.fillStyle = 'rgba(255,255,255,0.18)'; if (kind === 0) { c.beginPath(); c.arc(w * 0.15, -h * 0.15, w * 0.22, 0, TAU); c.fill(); c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.moveTo(-w / 2, h / 2); c.lineTo(-w * 0.1, 0); c.lineTo(w * 0.15, h * 0.2); c.lineTo(w / 2, -h * 0.05); c.lineTo(w / 2, h / 2); c.fill(); }
    else if (kind === 1) { for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(0, 0, w * (0.1 + i * 0.1), 0, TAU); c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 6; c.stroke(); } }
    else { for (let i = 0; i < 6; i++) { c.fillRect(-w / 2 + i * w / 6 + 6, h * 0.5 - h * (0.2 + 0.6 * hash(i, 4)), w / 6 - 12, h); } } c.restore();
    rr(-w / 2, -h / 2, w, h, 18); c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,0.7)'; c.stroke(); c.font = G(800, 20); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; rr(-w / 2 + 12, -h / 2 + 12, 92, 32, 16); c.fillStyle = 'rgba(0,0,0,0.55)'; c.fill(); c.fillStyle = LIME; c.fillText('✦ AI', -w / 2 + 28, -h / 2 + 29); c.restore(); }
  tile(1000, 170, 220, 0.1, '#FF7A3D', '#7A2BD6', 0); tile(820, 470, 170, -0.12, '#21C7D9', '#1B3BA8', 1); tile(1060, 760, 200, 0.08, '#F5F23A', '#2E9E1F', 2);
  // sparkles
  const spark = (x, y, s, col) => { c.save(); c.translate(x, y); c.beginPath(); c.moveTo(s, 0); for (let i = 1; i <= 4; i++) { const a = i * TAU / 4; c.quadraticCurveTo(0, 0, Math.cos(a) * s, Math.sin(a) * s); } c.closePath(); c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 20; c.fill(); c.restore(); };
  [[680, 90, 30, '#fff'], [1180, 330, 24, LIME], [900, 640, 20, '#fff'], [60, 1010, 26, LIME], [1230, 980, 22, '#fff']].forEach(([x, y, s, col]) => spark(x, y, s, col));
  // ---- vector lime slice (the LimeWire logo look)
  function lime(x, y, r) { c.save(); c.translate(x, y); c.shadowColor = 'rgba(184,240,42,0.8)'; c.shadowBlur = 70; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = '#2E9A1E'; c.fill(); c.shadowColor = 'transparent';
    c.beginPath(); c.arc(0, 0, r * 0.93, 0, TAU); c.fillStyle = '#E9F7B8'; c.fill(); c.beginPath(); c.arc(0, 0, r * 0.86, 0, TAU); g = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.86); g.addColorStop(0, '#F4F96A'); g.addColorStop(1, '#8CD62A'); c.fillStyle = g; c.fill();
    c.strokeStyle = '#E9F7B8'; c.lineWidth = r * 0.04; for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86); c.stroke(); }
    for (let i = 0; i < 10; i++) { const a = (i + 0.5) / 10 * TAU; c.save(); c.rotate(a); c.beginPath(); c.ellipse(r * 0.5, 0, r * 0.14, r * 0.06, 0, 0, TAU); c.fillStyle = 'rgba(255,255,200,0.85)'; c.fill(); c.restore(); }
    c.beginPath(); c.arc(0, 0, r * 0.08, 0, TAU); c.fillStyle = '#E9F7B8'; c.fill(); c.restore(); }
  lime(300, 300, 240);
  // ---- headline
  function word(s, x, y, size, fill, sx = 0.82, rot = -0.03) { c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = D(size); c.textAlign = 'left'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(s, 10, 14); c.lineWidth = size * 0.15; c.strokeStyle = INK; c.strokeText(s, 0, 0); c.fillStyle = fill; c.fillText(s, 0, 0); c.restore(); }
  word('FREE', 590, 210, 190, '#FFFFFF', 0.84, -0.03);
  word('LIMEWIRE', 60, 640, 190, LIME, 0.82);
  word('AI STUDIO', 60, 820, 170, '#FFFFFF', 0.82);
  // FOR LIFE stamp
  c.save(); c.translate(360, 975); c.rotate(-0.06); rr(-300, -62, 600, 124, 24); c.fillStyle = YEL; c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 24; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 8; c.strokeStyle = INK; c.stroke();
  c.scale(0.86, 1); c.font = D(96); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('FOR LIFE!!', 0, 6); c.restore();
  // ---- character (cropped above the hoodie lettering)
  const sc = 0.8, gw = girl.width * sc, gh = girl.height * sc, gx = W - gw + 30, gy = 0; /* girl.width includes the 260px shoulder extension */
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(girl, gx + Math.cos(a / 24 * TAU) * 9, gy + Math.sin(a / 24 * TAU) * 9, gw, gh);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(184,240,42,0.9)'; c.shadowBlur = 60; c.drawImage(off, 0, 0); c.restore(); c.drawImage(girl, gx, gy, gw, gh);
  document.body.dataset.ready = '1';
})();
</script></body></html>
