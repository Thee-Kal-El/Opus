<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Student Beans Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1920" height="1080"></canvas>
<script>
// "FREE STUDENT DISCOUNTS" — Student Beans YouTube thumbnail, 1920x1080. Student Beans purple + lime, fanned coupon cards
// with the real deals from the site, a grad cap, flying bills and the creator cutout.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1920, H = 1080, TAU = Math.PI * 2;
  const PUR = '#6A2BF0', DEEP = '#2A0B7A', LIME = '#E6FF3A', INK = '#14102A', RED = '#FF2D55', GRN = '#21C46B';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40)), document.fonts.load(G(600, 40))]);
  const me = new Image(); me.src = 'kal_cutout.png'; await me.decode();
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  function word(s, x, y, size, fill, sx = 0.86, rot = 0, align = 'left', stroke = '#10052E') {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = D(size); c.textAlign = align; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(10,0,40,0.6)'; c.fillText(s, 10, 14); c.lineWidth = size * 0.15; c.strokeStyle = stroke; c.strokeText(s, 0, 0); c.fillStyle = fill; c.fillText(s, 0, 0); c.restore();
  }
  // ---- background
  let g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#7A35FF'); g.addColorStop(0.55, PUR); g.addColorStop(1, DEEP); c.fillStyle = g; c.fillRect(0, 0, W, H);
  g = c.createRadialGradient(1500, 120, 0, 1500, 120, 900); g.addColorStop(0, 'rgba(230,255,58,0.35)'); g.addColorStop(1, 'rgba(230,255,58,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(1000, 560); for (let i = 0; i < 26; i++) { c.rotate(TAU / 26); if (i % 2) continue; c.beginPath(); c.moveTo(0, 0); c.lineTo(-140, -1500); c.lineTo(140, -1500); c.closePath(); c.fillStyle = 'rgba(255,255,255,0.06)'; c.fill(); } c.restore();
  // flying dollar bills
  function bill(x, y, w, rot) { const h = w * 0.45; c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 20; c.shadowOffsetY = 8; rr(-w / 2, -h / 2, w, h, 8); c.fillStyle = '#8FD694'; c.fill(); c.shadowColor = 'transparent'; rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 5); c.strokeStyle = '#2E7D3A'; c.lineWidth = 3; c.stroke(); c.beginPath(); c.arc(0, 0, h * 0.3, 0, TAU); c.fillStyle = '#C8F0C9'; c.fill(); c.font = D(h * 0.42); c.fillStyle = '#2E7D3A'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', 0, 2); c.restore(); }
  [[1050, 80, 170, 0.4], [880, 990, 150, -0.3], [60, 1010, 140, 0.25], [1240, 1010, 130, 0.6], [760, 70, 120, -0.5]].forEach(([x, y, w, r]) => bill(x, y, w, r));
  // ---- headline
  word('FREE', 60, 150, 170, '#FFFFFF', 0.86, -0.03);
  word('STUDENT', 60, 315, 170, '#FFFFFF', 0.86, -0.03);
  word('DISCOUNTS!!', 60, 490, 150, LIME, 0.84, -0.03);
  // brand chip
  c.save(); c.translate(70, 640); c.rotate(-0.03); rr(0, 0, 400, 86, 43); c.fillStyle = '#fff'; c.fill(); c.font = G(800, 46); c.fillStyle = PUR; c.textBaseline = 'middle'; c.fillText('StudentBeans', 40, 45); c.restore();
  // ---- coupon cards (real deals from the site), fanned
  function coupon(x, y, rot, pct, sub, brand, col) {
    const w = 400, h = 210; c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(10,0,40,0.55)'; c.shadowBlur = 40; c.shadowOffsetY = 14;
    c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 22); c.fillStyle = '#fff'; c.fill(); c.shadowColor = 'transparent'; c.save(); c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 22); c.clip();
    // ticket notches + perforation
    
    rr(-w / 2, -h / 2, 110, h, 22); c.fillStyle = col; c.fill(); c.save(); c.translate(-w / 2 + 55, 0); c.rotate(-Math.PI / 2); c.font = D(30); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(brand, 0, 2); c.restore();
    c.setLineDash([10, 10]); c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 3; c.beginPath(); c.moveTo(-w / 2 + 112, -h / 2 + 14); c.lineTo(-w / 2 + 112, h / 2 - 14); c.stroke(); c.setLineDash([]);
    c.font = D(110); c.fillStyle = INK; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(pct, -w / 2 + 140, -18); c.font = G(800, 30); c.fillStyle = col; c.fillText(sub, -w / 2 + 144, 64); c.restore(); c.restore();
  }
  coupon(1080, 330, -0.14, '25%', 'OFF EVERYTHING', 'MISSGUIDED', RED);
  coupon(1040, 600, 0.08, '20%', 'STUDENT DEAL', 'e.l.f.', PUR);
  coupon(1120, 860, -0.06, '15%', 'OFF TRAVEL', 'OMIO', '#1A9E8F');
  // ---- grad cap
  c.save(); c.translate(560, 900); c.rotate(-0.2); c.fillStyle = '#1A1530'; c.beginPath(); c.moveTo(0, -60); c.lineTo(170, 0); c.lineTo(0, 60); c.lineTo(-170, 0); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-95, 30); c.lineTo(-95, 95); c.quadraticCurveTo(0, 140, 95, 95); c.lineTo(95, 30); c.lineTo(0, 64); c.closePath(); c.fill(); c.strokeStyle = LIME; c.lineWidth = 6; c.beginPath(); c.moveTo(0, 0); c.lineTo(130, 40); c.lineTo(130, 120); c.stroke(); c.beginPath(); c.arc(130, 130, 14, 0, TAU); c.fillStyle = LIME; c.fill(); c.restore();
  // ---- creator cutout + lime outline
  const ph = 1020, pw = ph * me.width / me.height, px = W - pw + 30, py = H - ph + 60;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(me, px + Math.cos(a / 24 * TAU) * 11, py + Math.sin(a / 24 * TAU) * 11, pw, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(230,255,58,0.9)'; c.shadowBlur = 60; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pw, ph);
  // ---- "HIGH SCHOOL + COLLEGE" burst
  c.save(); c.translate(1390, 140); c.rotate(0.1); c.beginPath(); for (let i = 0; i < 32; i++) { const a = i / 32 * TAU, r = i % 2 ? 120 : 150; c.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r); } c.closePath(); c.fillStyle = LIME; c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 24; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 6; c.strokeStyle = INK; c.stroke();
  c.font = D(40); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('HIGH SCHOOL', 0, -26); c.fillText('+ COLLEGE', 0, 24); c.restore();
  document.body.dataset.ready = '1';
})();
</script></body></html>
