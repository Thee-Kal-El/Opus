<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PUBG AAAAAA Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// PUBG "YOU GOT KILLED" — vertical cover/thumbnail, 1080x1920, built from frames of the clip: the face-to-face gunfight (Real-ESRGAN x4),
// a red "YOU GOT KILLED SUCKER!!!" kill-feed slash, Kal's scream cut out as a sticker, and the KICK + TWITCH pill.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const YEL = '#FFE500', KICK = '#53FC18', TWI = '#9146FF', RED = '#FF2A2A', INK = '#06070A';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40))]);
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const [me, duel, kick, twitch] = await Promise.all([img('kal_scream_sticker.png'), img('../thumb/aaa/game_x4.png'), img('kick_k.png'), img('twitch_glitch.png')]);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  function word(s, x, y, size, fill, rot = 0, align = 'center', sx = 0.9, ital = true) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = (ital ? 'italic ' : '') + D(size); c.textAlign = align; c.textBaseline = 'middle'; c.letterSpacing = '-3px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillText(s, 10, 14); c.lineWidth = size * 0.17; c.strokeStyle = '#000'; c.strokeText(s, 0, 0);
    if (Array.isArray(fill)) { const g = c.createLinearGradient(0, -size / 2, 0, size / 2); fill.forEach((f, i) => g.addColorStop(i / (fill.length - 1), f)); c.fillStyle = g; } else c.fillStyle = fill; c.fillText(s, 0, 0); c.restore();
  }

  // ---- background: the duel, blurred + darkened full-bleed, red alarm wash
  c.save(); c.filter = 'blur(14px) brightness(0.4) saturate(1.3)'; c.drawImage(duel, -380, -60, 1840, 2150); c.restore();
  let g = c.createRadialGradient(540, 860, 200, 540, 860, 1100); g.addColorStop(0, 'rgba(255,30,20,0.35)'); g.addColorStop(1, 'rgba(60,0,0,0.0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(540, 860); for (let i = 0; i < 46; i++) { const a = i / 46 * TAU + 0.03; c.beginPath(); c.moveTo(Math.cos(a) * 520, Math.sin(a) * 520); c.lineTo(Math.cos(a) * 1500, Math.sin(a) * 1500); c.strokeStyle = i % 2 ? 'rgba(255,60,40,0.10)' : 'rgba(255,255,255,0.05)'; c.lineWidth = 10 + (i % 3) * 6; c.stroke(); } c.restore();

  // ---- the duel panel: source game crop (918x1072, plate is x4) → cropped to the fight and framed
  const PX = 40, PY = 430, PW = 1000, PH = 820;
  c.save(); c.translate(540, PY + PH / 2); c.rotate(-0.02); c.translate(-540, -(PY + PH / 2));
  c.shadowColor = 'rgba(255,30,20,0.85)'; c.shadowBlur = 60; rr(PX - 12, PY - 12, PW + 24, PH + 24, 34); c.fillStyle = '#0A0A0A'; c.fill(); c.shadowBlur = 0;
  c.save(); rr(PX, PY, PW, PH, 24); c.clip();
  // source crop (in plate px): x 0..3200, y 1040..3664 — blood in the air, the enemy by the tree, Kal aiming in the foreground
  c.filter = 'contrast(1.12) saturate(1.25) brightness(1.05)'; c.drawImage(duel, 0, 1040, 3200, 2624, PX, PY, PW, PH); c.filter = 'none';
  g = c.createLinearGradient(0, PY, 0, PY + PH); g.addColorStop(0.7, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)'); c.fillStyle = g; c.fillRect(PX, PY, PW, PH);
  c.restore();
  rr(PX, PY, PW, PH, 24); c.lineWidth = 8; c.strokeStyle = RED; c.stroke();
  c.restore();
  // crosshair-style target bracket on the enemy (enemy at plate ~ (1560,2110))
  const ex = PX + 1560 * PW / 3200, ey = PY + (2110 - 1040) * PH / 2624;
  c.save(); c.strokeStyle = RED; c.lineWidth = 9; c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 10; const b = 62, l = 26;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy2]) => { c.beginPath(); c.moveTo(ex + sx * b, ey + sy2 * (b - l)); c.lineTo(ex + sx * b, ey + sy2 * b); c.lineTo(ex + sx * (b - l), ey + sy2 * b); c.stroke(); }); c.restore();

  // ---- kill-feed slash across the duel
  c.save(); c.translate(540, 1035); c.rotate(-0.06);
  c.fillStyle = '#000'; c.fillRect(-600, -62, 1200, 124); c.fillStyle = '#D9140E'; c.fillRect(-600, -52, 1200, 104);
  c.font = 'italic ' + D(58); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#FFFFFF'; c.letterSpacing = '1px'; c.fillText('YOU GOT KILLED SUCKER!!!', 0, 4);
  c.restore();

  // ---- the scream: cut-out sticker bottom-left, whole head in frame, flat cut sits on the bottom edge
  { const mw = 720, mh = mw * me.height / me.width, off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
    o.save(); o.shadowColor = 'rgba(0,0,0,0.8)'; o.shadowBlur = 40; o.translate(0, H - mh + 34); o.rotate(0); o.drawImage(me, 0, 0, mw, mh); o.restore();
    c.drawImage(off, 0, 0); }
  // "TOP 10" chip next to the scream (he placed top 10)
  c.save(); c.translate(815, 1360); c.rotate(0.06); rr(-150, -64, 300, 128, 22); c.fillStyle = YEL; c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 24; c.fill(); c.shadowBlur = 0; c.lineWidth = 7; c.strokeStyle = '#000'; c.stroke();
  c.font = 'italic ' + D(74); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('TOP 10', 0, 6); c.restore();

  // ---- KICK + TWITCH pill, top, under the PUBG tag
  const sy = 205, px = 60, pw = 960, ph = 190; rr(px, sy, pw, ph, ph / 2); c.fillStyle = 'rgba(8,9,12,0.9)'; c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 30; c.fill(); c.shadowBlur = 0;
  c.lineWidth = 6; g = c.createLinearGradient(px, 0, px + pw, 0); g.addColorStop(0, KICK); g.addColorStop(1, TWI); c.strokeStyle = g; c.stroke();
  c.save(); rr(px + 40, sy + 30, 130, 130, 28); c.fillStyle = '#000'; c.fill(); c.lineWidth = 4; c.strokeStyle = KICK; c.stroke(); c.drawImage(kick, px + 62, sy + 45, 86, 100); c.restore();
  c.save(); rr(px + 190, sy + 30, 130, 130, 28); c.fillStyle = TWI; c.fill(); c.drawImage(twitch, px + 214, sy + 43, 82, 104); c.restore();
  c.font = G(800, 40); c.fillStyle = '#B4BAC2'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.letterSpacing = '4px'; c.fillText('LIVE ON KICK + TWITCH', px + 355, sy + 62);
  c.font = D(78); c.fillStyle = '#FFFFFF'; c.letterSpacing = '0px'; c.fillText('Thee_Kal_El', px + 352, sy + 128);
  // PUBG tag, centred and big
  rr(375, 60, 330, 110, 20); c.fillStyle = '#F2A900'; c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 20; c.fill(); c.shadowBlur = 0; c.lineWidth = 6; c.strokeStyle = '#000'; c.stroke();
  c.font = D(84); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '2px'; c.fillText('PUBG', 540, 118);
  document.title = 'done';
})();
</script></body></html>
