<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Heatbit Review Thumbnail</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
// YouTube thumbnail (1280×720) for Kal's video on Heatbit (heatbit.com): bitcoin miners that heat your home.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1280, H = 720, TAU = Math.PI * 2;
  const OR = '#FF5A1F', OR2 = '#FF9A3D', INK = '#140A06';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, M = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(M(800, 30))]);
  const img = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  const [bwater, bair, me, logo] = await Promise.all([img('bitwater.png'), img('bitair.png'), img('kal_face.png'), img('logo.png')]);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const sticker = (im, x, y, w, h, ring, glow) => { const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
    for (let a = 0; a < 28; a++) o.drawImage(im, x + Math.cos(a / 28 * TAU) * ring, y + Math.sin(a / 28 * TAU) * ring, w, h);
    o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
    c.save(); c.shadowColor = glow; c.shadowBlur = 40; c.shadowOffsetY = 10; c.drawImage(off, 0, 0); c.restore(); c.drawImage(im, x, y, w, h); };
  const word = (s, x, y, size, fill) => { c.save(); c.translate(x, y); c.rotate(-0.03); c.font = D(size); c.textAlign = 'left'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.save(); c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 22; c.shadowOffsetY = 8; c.lineWidth = size * 0.28; c.strokeStyle = INK; c.strokeText(s, 0, 0); c.restore();
    c.lineWidth = size * 0.28; c.strokeStyle = INK; c.strokeText(s, 0, 0); const g = c.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]); c.fillStyle = g; c.fillText(s, 0, 0); c.restore(); };

  // ---- background: dark ember → hot orange, glowing "heat lines" with bitcoin nodes (the site's motif)
  const bg = c.createRadialGradient(820, 420, 40, 820, 420, 980); bg.addColorStop(0, '#FF7A2E'); bg.addColorStop(0.3, '#B33A0E'); bg.addColorStop(0.65, '#3A1206'); bg.addColorStop(1, '#120502'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 1.5; for (let i = -20; i < 40; i++) { c.beginPath(); c.moveTo(i * 60, 0); c.lineTo(i * 60 - 400, H); c.stroke(); c.beginPath(); c.moveTo(i * 60, 0); c.lineTo(i * 60 + 400, H); c.stroke(); }
  const heat = (pts) => { c.save(); c.lineJoin = 'round'; c.lineCap = 'round'; c.shadowColor = '#FF8A2A'; c.shadowBlur = 22; c.strokeStyle = '#FFB060'; c.lineWidth = 6; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); c.shadowBlur = 0; c.strokeStyle = '#FFF0D8'; c.lineWidth = 2; c.stroke(); c.restore(); };
  heat([[-20, 610], [180, 560], [330, 640], [520, 560], [700, 650], [900, 580], [1300, 690]]);
  const node = (x, y, r) => { c.save(); c.shadowColor = 'rgba(255,120,0,0.9)'; c.shadowBlur = 30; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = '#FF5A1F'; c.fill(); c.shadowBlur = 0; c.lineWidth = r * 0.12; c.strokeStyle = '#fff'; c.stroke(); c.font = D(r * 1.25); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('₿', x + 1, y + r * 0.08); c.restore(); };
  node(700, 650, 24);
  // ---- Heatbit's products: Bitair (air purifier miner) and Bitwater (water heater miner), on a warm glow
  const product = (im, x, y, h, label) => { const w = h * im.width / im.height;
    const fl = c.createRadialGradient(x + w / 2, y + h, 10, x + w / 2, y + h, w * 0.9); fl.addColorStop(0, 'rgba(255,170,80,0.75)'); fl.addColorStop(1, 'rgba(255,120,40,0)'); c.fillStyle = fl; c.beginPath(); c.ellipse(x + w / 2, y + h, w * 0.9, w * 0.28, 0, 0, TAU); c.fill();
    c.save(); c.shadowColor = 'rgba(255,150,60,0.7)'; c.shadowBlur = 45; c.drawImage(im, x, y, w, h); c.restore(); c.drawImage(im, x, y, w, h);
    c.font = '800 26px Geist, "Inter Tight", sans-serif'; const lw = c.measureText(label + '  ›').width + 36; rr(x + w / 2 - lw / 2, y - 62, lw, 46, 23); c.fillStyle = '#fff'; c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 14; c.fill(); c.shadowBlur = 0;
    c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label + '  ›', x + w / 2, y - 38); c.textAlign = 'left'; };
  { const st = c.createRadialGradient(990, 240, 20, 990, 240, 330); st.addColorStop(0, 'rgba(255,236,210,0.55)'); st.addColorStop(1, 'rgba(255,200,150,0)'); c.fillStyle = st; c.fillRect(0, 0, W, H); }
  product(bair, 790, 120, 270, 'Bitair');
  product(bwater, 1030, 80, 290, 'Bitwater');

  // ---- Heatbit logo pill
  c.save(); rr(48, 40, 300, 84, 42); c.fillStyle = '#fff'; c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 20; c.shadowOffsetY = 6; c.fill(); c.restore();
  { const lw = 252, lh = lw * logo.height / logo.width; c.drawImage(logo, 72, 82 - lh / 2, lw, lh); }

  // ---- headline: about the company
  word('THIS COMPANY', 52, 265, 72, ['#FFFFFF', '#FFE2CC']);
  word('MAKES INNOVATIVE', 52, 368, 80, ['#FFFFFF', '#FFE2CC']);
  word('HOME MINERS!', 52, 490, 102, [OR2, OR]);

  // ---- url chip
  c.save(); rr(52, 610, 330, 70, 35); c.fillStyle = INK; c.fill(); c.lineWidth = 4; c.strokeStyle = OR2; c.stroke(); c.beginPath(); c.arc(88, 645, 10, 0, TAU); c.fillStyle = OR; c.fill();
  c.font = M(800, 34); c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.fillText('heatbit.com', 110, 647); c.restore();

  // ---- Kal (facecam photo) in a round badge, white ring + orange glow
  { const R = 165, x = 1090, y = 532; c.save(); c.shadowColor = 'rgba(255,110,20,0.8)'; c.shadowBlur = 50; c.beginPath(); c.arc(x, y, R + 14, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.restore();
    c.save(); c.beginPath(); c.arc(x, y, R, 0, TAU); c.clip(); c.drawImage(me, x - R, y - R, 2 * R, 2 * R); c.restore();
    c.beginPath(); c.arc(x, y, R + 14, 0, TAU); c.lineWidth = 6; c.strokeStyle = OR; c.stroke(); }
  document.body.dataset.ready = '1';
})();
</script></body></html>
