<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gibwork Shorts Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// Gibwork YouTube Shorts thumbnail, 1080x1920. Purple burst, giant "GET PAID" type, the real bounty card, a wallet hit,
// flying USDC coins and the creator cutout pointing at the money. Brand vectors redrawn from the Gibwork film.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const PUR = '#8151FD', PUR2 = '#A98BFF', DEEP = '#2A0F78', YEL = '#FFE13B', GRN = '#139A6B', GRN2 = '#1FD18E', INK = '#111114', MUTE = '#6E6E78', USDC = '#2775CA';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40)), document.fonts.load(G(500, 40)), document.fonts.load(G(700, 40))]);
  const me = new Image(); me.src = 'kal_cutout.png'; await me.decode();
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  const GLYPH = [[0, 0, 1, 6.5], [5, 0, 1, 6.5], [2.5, 3.3, 1, 2.3], [2, 5.6, 2, 0.9], [1, 6.5, 1, 1], [4, 6.5, 1, 1]];
  const glyph = (x, y, u, col = '#fff') => { c.fillStyle = col; for (const [gx, gy, gw, gh] of GLYPH) c.fillRect(x + (gx - 3) * u, y + (gy - 3.75) * u, gw * u + 0.5, gh * u + 0.5); };
  const logoDisc = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = PUR; c.fill(); glyph(x, y, r / 6.8); };
  const verified = (x, y, r) => { c.beginPath(); for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, q = i % 2 ? r * 0.86 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } c.closePath(); c.fillStyle = PUR; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = r * 0.24; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(x - r * 0.38, y); c.lineTo(x - r * 0.1, y + r * 0.3); c.lineTo(x + r * 0.42, y - r * 0.3); c.stroke(); };
  const coin = (x, y, r, sq = 1, rot = 0) => { c.save(); c.translate(x, y); c.rotate(rot); c.scale(sq, 1); c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 20; c.shadowOffsetY = 10; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = USDC; c.fill(); c.shadowColor = 'transparent'; c.strokeStyle = '#fff'; c.lineWidth = r * 0.1; c.beginPath(); c.arc(0, 0, r * 0.68, 0, TAU); c.stroke(); c.font = G(800, r * 0.95); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', 0, r * 0.05); c.restore(); };
  // poster word: thick dark stroke + drop shadow + fill (yellow/white), squeezed horizontally
  function word(s, x, y, size, fill, sx = 0.86, rot = 0, stroke = '#12052E') {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = D(size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(10,0,30,0.55)'; c.fillText(s, 10, 16); c.lineWidth = size * 0.16; c.strokeStyle = stroke; c.strokeText(s, 0, 0);
    if (Array.isArray(fill)) { const g = c.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]); c.fillStyle = g; } else c.fillStyle = fill; c.fillText(s, 0, 0); c.restore();
  }
  // ---- background: purple burst
  const bg = c.createRadialGradient(W / 2, 980, 0, W / 2, 980, 1300); bg.addColorStop(0, '#B08BFF'); bg.addColorStop(0.35, PUR); bg.addColorStop(1, DEEP); c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.save(); c.translate(W / 2, 1000); for (let i = 0; i < 28; i++) { c.rotate(TAU / 28); c.beginPath(); c.moveTo(0, 0); c.lineTo(-90, -1600); c.lineTo(90, -1600); c.closePath(); c.fillStyle = i % 2 ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.0)'; c.fill(); } c.restore();
  c.fillStyle = 'rgba(255,255,255,0.12)'; for (let y = 13; y < H; y += 34) for (let x = 13; x < W; x += 34) { c.beginPath(); c.arc(x, y, 2.2, 0, TAU); c.fill(); }
  const vg = c.createRadialGradient(W / 2, H / 2, 600, W / 2, H / 2, 1200); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,0,40,0.55)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  // ---- background coins
  [[110, 760, 46, 0.5], [980, 700, 40, 0.9], [70, 1180, 34, 1], [1010, 1240, 52, 0.4], [180, 560, 30, 0.8], [930, 520, 28, 1]].forEach(([x, y, r, sq], i) => coin(x, y, r, sq, (hash(i) - 0.5) * 0.6));
  // ---- brand line
  logoDisc(W / 2 - 170, 120, 46); c.font = G(800, 64); c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.fillText('gibwork', W / 2 - 108, 118); verified(W / 2 - 108 + c.measureText('gibwork').width + 36, 114, 24);
  // ---- headline
  word('GET PAID', W / 2, 330, 250, [YEL, '#FFB400'], 0.84, -0.035);
  word('TO DO', W / 2 - 250, 495, 110, '#FFFFFF', 0.86, -0.035);
  word('TASKS', W / 2 + 120, 500, 150, '#FFFFFF', 0.86, -0.035);
  word('ONLINE!!', W / 2, 655, 170, '#FFFFFF', 0.86, -0.035);
  // ---- bounty card (the real $1,000 hackathon bounty)
  c.save(); c.translate(W / 2 + 40, 875); c.rotate(-0.06);
  const cw = 900, ch = 230; c.shadowColor = 'rgba(31,209,142,0.9)'; c.shadowBlur = 70; rr(-cw / 2, -ch / 2, cw, ch, 30); c.fillStyle = '#fff'; c.fill(); c.shadowBlur = 0; c.lineWidth = 8; c.strokeStyle = GRN2; c.stroke();
  c.shadowColor = 'transparent'; logoDisc(-cw / 2 + 105, 0, 66); c.fillStyle = INK; c.font = G(800, 40); c.textBaseline = 'middle'; c.fillText('Hackathon', -cw / 2 + 200, -48);
  c.font = G(500, 34); c.fillStyle = MUTE; c.fillText('@gibwork', -cw / 2 + 200, 6); verified(-cw / 2 + 200 + c.measureText('@gibwork').width + 26, 6, 16);
  rr(-cw / 2 + 200, 40, 230, 54, 27); c.strokeStyle = '#DADAE0'; c.lineWidth = 3; c.stroke(); c.font = G(700, 30); c.fillStyle = INK; c.fillText('Development', -cw / 2 + 222, 68);
  c.font = D(84); c.textAlign = 'right'; c.fillStyle = GRN; c.fillText('$1,000', cw / 2 - 34, -4); c.font = G(700, 30); c.fillStyle = MUTE; c.fillText('BOUNTY', cw / 2 - 36, 70); c.textAlign = 'left';
  c.restore();
  // "+$300" wallet hit badge
  c.save(); c.translate(W - 210, 1110); c.rotate(0.12); c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 30; c.shadowOffsetY = 12; rr(-170, -78, 340, 156, 40); c.fillStyle = GRN; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 7; c.strokeStyle = '#fff'; c.stroke();
  c.font = D(92); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('+$300', 0, -6); c.font = G(800, 26); c.fillText('PAID IN USDC', 0, 50); c.restore();
  // ---- creator cutout with a white sticker outline + purple glow
  const ph = 980, pw = ph * me.width / me.height, px = -10, py = H - ph + 70;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(me, px + Math.cos(a / 24 * TAU) * 12, py + Math.sin(a / 24 * TAU) * 12, pw, ph);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(20,0,60,0.8)'; c.shadowBlur = 60; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, px, py, pw, ph);
  // ---- big red arrow from the creator to the bounty
  c.save(); c.translate(640, 1420); c.rotate(-0.95); c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 24; c.shadowOffsetY = 10;
  c.beginPath(); c.moveTo(-150, -34); c.lineTo(80, -34); c.lineTo(80, -95); c.lineTo(210, 0); c.lineTo(80, 95); c.lineTo(80, 34); c.lineTo(-150, 34); c.closePath(); c.fillStyle = '#FF2A2A'; c.fill(); c.shadowBlur = 0; c.lineWidth = 10; c.strokeStyle = '#fff'; c.lineJoin = 'round'; c.stroke(); c.restore();
  // ---- foreground coins + sparkles
  [[880, 1480, 78, 0.85, 0.2], [760, 1700, 60, 0.45, -0.3], [990, 1720, 44, 1, 0]].forEach(([x, y, r, sq, rot]) => coin(x, y, r, sq, rot));
  const spark = (x, y, s, col) => { c.save(); c.translate(x, y); c.beginPath(); c.moveTo(s, 0); for (let i = 1; i <= 4; i++) { const a = i * TAU / 4; c.quadraticCurveTo(0, 0, Math.cos(a) * s, Math.sin(a) * s); } c.closePath(); c.fillStyle = col; c.fill(); c.restore(); };
  [[90, 330, 40, YEL], [1000, 300, 34, '#fff'], [960, 820, 30, YEL], [120, 960, 26, '#fff'], [640, 1240, 30, YEL]].forEach(([x, y, s, col]) => spark(x, y, s, col));
  // ---- bottom URL strip
  c.save(); c.translate(W - 250, H - 110); rr(-210, -50, 420, 100, 50); c.fillStyle = INK; c.fill(); c.lineWidth = 4; c.strokeStyle = GRN2; c.stroke(); c.beginPath(); c.arc(-160, 0, 12, 0, TAU); c.fillStyle = GRN2; c.fill();
  c.font = '800 46px "JetBrains Mono", monospace'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('gib.work', 24, 3); c.restore();
  document.body.dataset.ready = '1';
})();
</script></body></html>
