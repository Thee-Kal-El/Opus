<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thee_Kal_El Poster</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<!-- 11x14 in print poster @ 300 dpi -->
<canvas id="s" width="3300" height="4200"></canvas>
<script>
(async () => {
  const W = 3300, H = 4200, TAU = Math.PI * 2, cv = document.getElementById('s'), c = cv.getContext('2d');
  const V = (location.search.match(/v=(\w)/) || [])[1] || 'a'; /* a: busier background · b: socials float, coins along the bottom */
  const PUR = '#9B4DFF', PINK = '#FF3DDB', CYAN = '#22E6FF', INK = '#07031A';
  const G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`, MONO = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const im = new Image(); im.src = 'kal_cutout_x4_noglare.png'; await im.decode();
  await Promise.all([document.fonts.load(G(900, 100)), document.fonts.load(G(700, 100)), document.fonts.load(MONO(800, 60))]);

  // ---- backdrop: deep purple, neon glow, data rain, perspective grid floor ----
  let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#12052E'); g.addColorStop(0.55, '#1E0846'); g.addColorStop(1, '#07031A'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  g = c.createRadialGradient(W / 2, 1500, 0, W / 2, 1500, 1900); g.addColorStop(0, 'rgba(190,80,255,0.75)'); g.addColorStop(0.4, 'rgba(120,40,230,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.font = MONO(700, 46); c.textAlign = 'center'; c.textBaseline = 'middle'; const CH = '0123456789ABCDEF';
  for (let x = 40, i = 0; x < W; x += 92, i++) for (let y = 40, j = 0; y < 2800; y += 92, j++) { const v = hash(i, j); if (v < 0.55) continue; c.fillStyle = `rgba(190,150,255,${0.05 + 0.12 * hash(j, i)})`; c.fillText(CH[(v * 997 | 0) % 16], x, y); }
  // light streaks
  c.save(); c.globalCompositeOperation = 'lighter';
  [[-200, 1900, W + 200, 1250, PINK], [-200, 1150, W + 200, 1700, CYAN], [-200, 2350, W + 200, 2050, PUR]].forEach(([x0, y0, x1, y1, col]) => { for (let k = 0; k < 3; k++) { c.strokeStyle = col; c.globalAlpha = [0.08, 0.18, 0.7][k]; c.lineWidth = [60, 22, 4][k]; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); } });
  c.restore();
  // grid floor
  c.save(); const hz = 2650; c.beginPath(); c.rect(0, hz, W, H - hz); c.clip(); g = c.createLinearGradient(0, hz, 0, H); g.addColorStop(0, 'rgba(255,61,219,0.0)'); g.addColorStop(0.15, 'rgba(255,61,219,0.55)'); g.addColorStop(1, 'rgba(155,77,255,0.25)'); c.strokeStyle = g; c.lineWidth = 5;
  for (let i = -24; i <= 24; i++) { c.beginPath(); c.moveTo(W / 2 + i * 40, hz); c.lineTo(W / 2 + i * 520, H); c.stroke(); }
  for (let k = 1; k < 16; k++) { const y = hz + (H - hz) * Math.pow(k / 15, 2.2); c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } c.restore();

  // ---- variant a: extra depth — blurred far-away coins, circuit traces, floating chained blocks, sparkles ----
  if (V === 'a') {
    c.save(); c.filter = 'blur(10px)'; for (let i = 0; i < 16; i++) { const x = hash(i, 41) * W, y = 200 + hash(i, 42) * 2500, r = 40 + hash(i, 43) * 70, col = ['#F7931A', '#627EEA', '#14F195', '#2775CA', '#FF3DDB'][i % 5]; c.globalAlpha = 0.35; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = col; c.fill(); } c.restore();
    c.save(); c.lineWidth = 6; c.lineJoin = 'round'; for (let i = 0; i < 14; i++) { const left = i % 2 === 0, y = 300 + i * 175 + hash(i, 5) * 60, len = 260 + hash(i, 6) * 300; c.strokeStyle = i % 3 ? 'rgba(34,230,255,0.35)' : 'rgba(255,61,219,0.35)'; c.beginPath(); const x0 = left ? 0 : W; c.moveTo(x0, y); const dx = left ? 1 : -1; c.lineTo(x0 + dx * len, y); c.lineTo(x0 + dx * (len + 90), y + (hash(i, 7) > 0.5 ? 90 : -90)); c.lineTo(x0 + dx * (len + 220), y + (hash(i, 7) > 0.5 ? 90 : -90)); c.stroke(); c.fillStyle = c.strokeStyle; c.beginPath(); c.arc(x0 + dx * (len + 220), y + (hash(i, 7) > 0.5 ? 90 : -90), 14, 0, TAU); c.fill(); } c.restore();
    const cube = (x, y, s, col) => { c.save(); c.translate(x, y); c.lineJoin = 'round'; const h = s * 0.58; const faces = [[[0, -s], [s * 0.87, -s / 2], [0, 0], [-s * 0.87, -s / 2], 'rgba(255,255,255,0.18)'], [[-s * 0.87, -s / 2], [0, 0], [0, s], [-s * 0.87, s / 2], 'rgba(0,0,0,0.25)'], [[0, 0], [s * 0.87, -s / 2], [s * 0.87, s / 2], [0, s], 'rgba(0,0,0,0.05)']];
      c.shadowColor = col; c.shadowBlur = 50; faces.forEach((f) => { c.beginPath(); f.slice(0, 4).forEach(([a, b]) => c.lineTo(a, b)); c.closePath(); c.fillStyle = 'rgba(40,10,90,0.9)'; c.fill(); c.fillStyle = f[4]; c.fill(); c.lineWidth = 7; c.strokeStyle = col; c.stroke(); }); c.restore(); };
    const blocks = [[260, 1480, 120, CYAN], [560, 2520, 95, PINK], [3050, 1420, 120, PINK], [2760, 2500, 95, CYAN], [1650 - 1250, 330, 70, PINK], [1650 + 1250, 330, 70, CYAN]];
    c.save(); c.setLineDash([22, 18]); c.lineWidth = 6; c.strokeStyle = 'rgba(255,255,255,0.4)'; [[0, 1], [2, 3], [4, 0], [5, 2]].forEach(([a, b]) => { c.beginPath(); c.moveTo(blocks[a][0], blocks[a][1]); c.lineTo(blocks[b][0], blocks[b][1]); c.stroke(); }); c.restore();
    blocks.forEach(([x, y, s, col]) => cube(x, y, s, col));
    const spark = (x, y, r) => { c.save(); c.translate(x, y); c.beginPath(); c.moveTo(r, 0); for (let i = 1; i <= 4; i++) { const a = i * TAU / 4; c.quadraticCurveTo(0, 0, Math.cos(a) * r, Math.sin(a) * r); } c.fillStyle = '#fff'; c.shadowColor = '#fff'; c.shadowBlur = 30; c.fill(); c.restore(); };
    [[900, 520, 40], [2420, 600, 34], [180, 2950, 30], [3120, 3000, 36], [1150, 2380, 26], [2200, 2350, 28], [3150, 760, 26], [160, 760, 30]].forEach((a) => spark(...a));
  }
  // ---- neon hexagon behind him (callback to the old poster) ----
  const hex = (cx, cy, r) => { c.beginPath(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } c.closePath(); };
  c.save(); hex(W / 2, 1500, 1180); c.fillStyle = 'rgba(80,20,160,0.35)'; c.fill();
  c.globalCompositeOperation = 'lighter'; [[90, 0.12], [40, 0.3], [14, 1]].forEach(([lw, a]) => { c.strokeStyle = `rgba(230,120,255,${a})`; c.lineWidth = lw; hex(W / 2, 1500, 1180); c.stroke(); }); c.restore();
  // blockchain nodes on the hex corners + links
  const nodes = []; for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; nodes.push([W / 2 + Math.cos(a) * 1180, 1500 + Math.sin(a) * 1180]); }
  nodes.forEach(([x, y]) => { c.save(); c.shadowColor = CYAN; c.shadowBlur = 60; c.fillStyle = INK; rr(x - 70, y - 70, 140, 140, 26); c.fill(); c.lineWidth = 10; c.strokeStyle = CYAN; c.stroke(); c.fillStyle = CYAN; rr(x - 28, y - 28, 56, 56, 8); c.fill(); c.restore(); });

  // ---- the creator: sticker cutout with white outline + neon rim ----
  const ph = 2900, pw = ph * im.width / im.height, px = (W - pw) / 2, py = 420;
  const st = document.createElement('canvas'); st.width = W; st.height = H; const s = st.getContext('2d');
  for (let i = 0; i < 32; i++) { const a = i * TAU / 32; s.drawImage(im, px + Math.cos(a) * 22, py + Math.sin(a) * 22, pw, ph); }
  s.globalCompositeOperation = 'source-in'; s.fillStyle = '#fff'; s.fillRect(0, 0, W, H); s.globalCompositeOperation = 'source-over';
  c.save(); c.shadowColor = 'rgba(255,61,219,0.9)'; c.shadowBlur = 120; c.drawImage(st, 0, 0); c.restore(); c.drawImage(st, 0, 0); c.drawImage(im, px, py, pw, ph);
  // fade his lower half into the floor so the name reads
  g = c.createLinearGradient(0, 2600, 0, 3200); g.addColorStop(0, 'rgba(7,3,26,0)'); g.addColorStop(1, 'rgba(7,3,26,0.97)'); c.fillStyle = g; c.fillRect(0, 2600, W, H - 2600);

  // ---- crypto coins ----
  const coin = (x, y, r, rot, col, draw) => { c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = col; c.shadowBlur = 70; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = col; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = r * 0.09; c.strokeStyle = 'rgba(255,255,255,0.85)'; c.stroke(); draw(r); c.restore(); };
  const COIN = {
    btc: (x, y, r, rot) => coin(x, y, r, rot, '#F7931A', (r) => { c.font = G(900, r * 1.3); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('₿', 0, r * 0.06); }),
    eth: (x, y, r, rot) => coin(x, y, r, rot, '#627EEA', (r) => { c.fillStyle = '#fff'; c.beginPath(); c.moveTo(0, -r * 0.62); c.lineTo(r * 0.38, r * 0.02); c.lineTo(0, r * 0.22); c.lineTo(-r * 0.38, r * 0.02); c.closePath(); c.fill(); c.globalAlpha = 0.75; c.beginPath(); c.moveTo(0, r * 0.32); c.lineTo(r * 0.38, r * 0.1); c.lineTo(0, r * 0.62); c.lineTo(-r * 0.38, r * 0.1); c.closePath(); c.fill(); }),
    sol: (x, y, r, rot) => coin(x, y, r, rot, '#111', (r) => { const gg = c.createLinearGradient(-r, 0, r, 0); gg.addColorStop(0, '#9945FF'); gg.addColorStop(1, '#14F195'); c.fillStyle = gg; [-0.36, 0, 0.36].forEach((dy, i) => { c.save(); c.translate(0, dy * r); c.beginPath(); const w = r * 1.1, h = r * 0.2, sk = r * 0.18 * (i === 1 ? -1 : 1); c.moveTo(-w / 2 + sk, -h / 2); c.lineTo(w / 2 + sk, -h / 2); c.lineTo(w / 2 - sk, h / 2); c.lineTo(-w / 2 - sk, h / 2); c.closePath(); c.fill(); c.restore(); }); }),
    // Arc ecosystem coin: navy gradient disc with the Arc "A" (same vector as the Arc promo)
    arc: (x, y, r, rot) => { c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = '#3D6BFF'; c.shadowBlur = 70; const gg = c.createLinearGradient(0, -r, 0, r); gg.addColorStop(0, '#2B55D0'); gg.addColorStop(1, '#0B1736'); c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = gg; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = r * 0.09; c.strokeStyle = 'rgba(255,255,255,0.85)'; c.stroke();
      const k = r * 1.3 / 100; c.scale(k, k); c.translate(0, 3); c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 15; c.beginPath(); c.moveTo(-34, 40); c.bezierCurveTo(-30, -10, -18, -42, 0, -42); c.bezierCurveTo(18, -42, 30, -10, 34, 40); c.stroke(); c.lineWidth = 12; c.beginPath(); c.moveTo(-22, 18); c.quadraticCurveTo(10, 8, 40, 26); c.stroke(); c.restore(); },
  };
  // Solana and Bitcoin swapped places
  if (V === 'a') { COIN.sol(470, 900, 190, -0.2); COIN.eth(2830, 860, 175, 0.18); COIN.btc(2920, 2050, 150, -0.12); COIN.arc(380, 2120, 135, 0.25); }

  // ---- top chip ----
  c.save(); c.font = G(800, 92); c.letterSpacing = '10px'; const chip = 'BLOCKCHAIN  •  CRYPTO  •  WEB3', cw = c.measureText(chip).width + 160; rr((W - cw) / 2, 150, cw, 170, 85); c.fillStyle = 'rgba(7,3,26,0.85)'; c.fill(); c.lineWidth = 8; c.strokeStyle = CYAN; c.shadowColor = CYAN; c.shadowBlur = 40; c.stroke(); c.shadowBlur = 0;
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(chip, W / 2 + 5, 240); c.restore();

  // ---- the handle ----
  const handle = '@THEE_KAL_EL'; c.save(); c.font = G(900, 400); c.letterSpacing = '-6px'; let fs = Math.min(400, 400 * (W - 260) / c.measureText(handle).width); c.font = G(900, fs); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  const hy = 3330; c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(handle, W / 2 + 18, hy + 26);
  c.lineWidth = fs * 0.12; c.strokeStyle = INK; c.strokeText(handle, W / 2, hy);
  c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(34,230,255,0.85)'; c.fillText(handle, W / 2 - 12, hy); c.fillStyle = 'rgba(255,61,219,0.85)'; c.fillText(handle, W / 2 + 12, hy); c.globalCompositeOperation = 'source-over';
  g = c.createLinearGradient(0, hy - fs * 0.75, 0, hy); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#E3C8FF'); c.fillStyle = g; c.fillText(handle, W / 2, hy); c.restore();
  c.save(); c.font = G(700, 104); c.letterSpacing = '6px'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#E9DBFF'; c.fillText('Blockchain Tech, Decoded.', W / 2, 3480); c.restore();

  // ---- platform tiles ----
  const tileAt = (x, y, T, bg, draw, glow, rot = 0) => { c.save(); c.translate(x + T / 2, y + T / 2); c.rotate(rot); c.translate(-T / 2, -T / 2); c.shadowColor = glow; c.shadowBlur = 80 * T / 400; rr(0, 0, T, T, 92 * T / 400); c.fillStyle = typeof bg === 'function' ? bg(T) : bg; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 8 * T / 400; c.strokeStyle = 'rgba(255,255,255,0.9)'; c.stroke(); c.save(); rr(0, 0, T, T, 92 * T / 400); c.clip(); c.scale(T / 400, T / 400); draw(); c.restore(); c.restore(); };
  const TILE = {
    yt: ['#fff', () => { rr(60, 105, 280, 195, 58); c.fillStyle = '#FF0000'; c.fill(); c.beginPath(); c.moveTo(168, 150); c.lineTo(250, 202); c.lineTo(168, 254); c.closePath(); c.fillStyle = '#fff'; c.fill(); }, '#FF0000'],
    tt: ['#000', () => { const note = (dx, dy, col) => { c.save(); c.translate(dx, dy); c.fillStyle = col; c.beginPath(); c.arc(160, 255, 62, 0, TAU); c.fill(); c.fillStyle = '#000'; c.beginPath(); c.arc(160, 255, 28, 0, TAU); c.fill(); c.fillStyle = col; c.fillRect(194, 85, 38, 172); c.beginPath(); c.moveTo(194, 85); c.quadraticCurveTo(212, 150, 300, 160); c.lineTo(300, 196); c.quadraticCurveTo(236, 196, 194, 150); c.closePath(); c.fill(); c.restore(); };
      c.globalCompositeOperation = 'lighter'; note(-10, -6, '#25F4EE'); note(10, 6, '#FE2C55'); c.globalCompositeOperation = 'source-over'; note(0, 0, '#fff'); }, '#25F4EE'],
    ig: [(T) => { const gg = c.createLinearGradient(0, T, T, 0); gg.addColorStop(0, '#FEDA75'); gg.addColorStop(0.3, '#FA7E1E'); gg.addColorStop(0.55, '#D62976'); gg.addColorStop(0.8, '#962FBF'); gg.addColorStop(1, '#4F5BD5'); return gg; }, () => { c.strokeStyle = '#fff'; c.lineWidth = 30; rr(90, 90, 220, 220, 66); c.stroke(); c.beginPath(); c.arc(200, 200, 54, 0, TAU); c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(262, 138, 16, 0, TAU); c.fill(); }, '#D62976'],
    tw: ['#9146FF', () => { c.fillStyle = '#fff'; c.beginPath(); c.moveTo(110, 80); c.lineTo(300, 80); c.lineTo(300, 230); c.lineTo(240, 290); c.lineTo(195, 290); c.lineTo(160, 325); c.lineTo(160, 290); c.lineTo(110, 290); c.closePath(); c.fill(); c.fillStyle = '#9146FF'; c.fillRect(175, 130, 26, 80); c.fillRect(240, 130, 26, 80); }, '#9146FF'],
    kick: ['#000', () => { c.fillStyle = '#53FC18'; const u = 46, ox = 92, oy = 85; [[0, 0, 2, 5], [2, 1.5, 1, 2], [3, 0.75, 1, 1], [3, 2.75, 1, 1], [4, 0, 1, 1], [4, 4, 1, 1]].forEach(([x, y, w, h]) => c.fillRect(ox + x * u, oy + y * u, w * u + 1, h * u + 1)); c.fillRect(ox + 3 * u, oy + 0, u + 1, 1.5 * u); c.fillRect(ox + 3 * u, oy + 3.5 * u, u + 1, 1.5 * u); }, '#53FC18'],
  };
  const T = 400, gap = 120, row = 5 * T + 4 * gap, tx0 = (W - row) / 2, ty = 3610;
  if (V === 'a') ['yt', 'tt', 'ig', 'tw', 'kick'].forEach((k, i) => tileAt(tx0 + i * (T + gap), ty, T, ...TILE[k]));
  else {
    // socials float where the coins were (zig-zag down both sides) …
    const S = 340; [['yt', 470, 820, -0.12], ['tt', 2830, 860, 0.12], ['ig', 380, 1560, 0.1], ['tw', 2920, 1640, -0.1], ['kick', 470, 2280, -0.08]].forEach(([k, x, y, rot]) => tileAt(x - S / 2, y - S / 2, S, ...TILE[k], rot));
    // … and the coins line the bottom (Solana first, Bitcoin where Solana was)
    const R = 190, cg = (row - 4 * 2 * R) / 3; ['sol', 'eth', 'arc', 'btc'].forEach((k, i) => COIN[k](tx0 + R + i * (2 * R + cg), ty + T / 2, R, 0));
  }
  // footer
  c.save(); c.font = MONO(800, 70); c.letterSpacing = '14px'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = CYAN; c.shadowColor = CYAN; c.shadowBlur = 30; c.fillText('SAME HANDLE · EVERY PLATFORM', W / 2, 4110); c.restore();
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
