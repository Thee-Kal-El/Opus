<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fuck Flock Poster</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<!-- 11x14 in protest poster @ 300 dpi. The arrow points up at the camera the poster is hung under. -->
<canvas id="s" width="3300" height="4200"></canvas>
<script>
(async () => {
  const W = 3300, H = 4200, TAU = Math.PI * 2, cv = document.getElementById('s'), c = cv.getContext('2d');
  const YEL = '#FFD400', INK = '#0A0A0A', RED = '#FF2A2A', WHITE = '#F7F5EE';
  const G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`, MONO = (w, s) => `${w} ${s}px "JetBrains Mono", monospace`;
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  await Promise.all([document.fonts.load(G(900, 100)), document.fonts.load(G(800, 100)), document.fonts.load(G(600, 100)), document.fonts.load(MONO(800, 60))]);
  // condensed poster type: squeeze horizontally, auto-fit to a width
  const big = (s, x, y, size, col, maxW, sx = 0.78, ls = -8) => { c.save(); c.font = G(900, size); c.letterSpacing = ls + 'px'; const w = c.measureText(s).width * sx, k = Math.min(1, maxW / w); c.translate(x, y); c.scale(sx * k, k); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = col; c.fillText(s, 0, 0); c.restore(); };
  const line = (s, x, y, font, col, align = 'center', ls = 0) => { c.save(); c.font = font; c.letterSpacing = ls + 'px'; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); c.restore(); };

  c.fillStyle = INK; c.fillRect(0, 0, W, H);

  // ---------------- TOP: the arrow ----------------
  // yellow field with a giant black arrow pointing straight up
  c.fillStyle = YEL; c.fillRect(0, 0, W, 1500);
  c.save(); c.fillStyle = INK; c.beginPath();
  const ax = W / 2, tip = 110, headB = 820, headW = 1000, shaftW = 300, shaftB = 1090;
  c.moveTo(ax, tip); c.lineTo(ax + headW, headB); c.lineTo(ax + shaftW, headB); c.lineTo(ax + shaftW, shaftB); c.lineTo(ax - shaftW, shaftB); c.lineTo(ax - shaftW, headB); c.lineTo(ax - headW, headB); c.closePath(); c.fill(); c.restore();
  // camera icon inside the arrow head
  c.save(); c.translate(ax, 560); c.fillStyle = YEL; c.beginPath(); c.roundRect(-210, -95, 330, 190, 26); c.fill(); c.beginPath(); c.moveTo(120, -50); c.lineTo(250, -105); c.lineTo(250, 105); c.lineTo(120, 50); c.closePath(); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(-45, 0, 62, 0, TAU); c.fill(); c.fillStyle = RED; c.beginPath(); c.arc(-45, 0, 30, 0, TAU); c.fill(); c.fillStyle = RED; c.beginPath(); c.arc(-170, -60, 15, 0, TAU); c.fill(); c.restore();
  // side labels on the yellow
  line('LOOK', 520, 520, G(900, 190), INK, 'center', 10); line('UP', 2780, 520, G(900, 190), INK, 'center', 10);
  line('↑', 520, 760, G(900, 220), INK); line('↑', 2780, 760, G(900, 220), INK);
  line("THAT'S A FLOCK CAMERA.", ax, 1265, G(900, 170), INK, 'center', 8);
  line('IT SEES', ax, 925, G(900, 92), YEL, 'center', 6); line('YOU.', ax, 1025, G(900, 92), YEL, 'center', 6);

  // hazard stripe band
  c.save(); c.beginPath(); c.rect(0, 1500, W, 150); c.clip(); c.fillStyle = INK; c.fillRect(0, 1500, W, 150); c.fillStyle = YEL;
  for (let x = -300; x < W + 300; x += 220) { c.beginPath(); c.moveTo(x, 1650); c.lineTo(x + 110, 1650); c.lineTo(x + 260, 1500); c.lineTo(x + 150, 1500); c.closePath(); c.fill(); } c.restore();

  // ---------------- HEADLINE ----------------
  big('FUCK', W / 2, 2420, 900, WHITE, W - 240, 0.8, -6);
  big('FLOCK', W / 2, 3230, 900, YEL, W - 240, 0.8, -6);
  // red redaction bar slashing through, behind nothing — a hit of red
  c.save(); c.translate(W / 2, 2500); c.rotate(-0.02); c.fillStyle = RED; c.fillRect(-1450, -22, 2900, 44); c.restore();

  // ---------------- FACTS ----------------
  const facts = ['Every car that passes gets photographed:', 'plate, make, color, dents, bumper stickers.', 'Logged, searchable, and shared with', 'police agencies across the country.'];
  facts.forEach((s, i) => line(s, W / 2, 3385 + i * 104, G(i % 2 ? 600 : 800, 96), i % 2 ? '#CFCBC0' : WHITE));
  // three chips
  const chips = ['EVERY CAR', 'EVERY PLATE', 'EVERY DAY'], cw = 900, cg = 90, cx0 = (W - (3 * cw + 2 * cg)) / 2;
  chips.forEach((s, i) => { const x = cx0 + i * (cw + cg); c.save(); c.beginPath(); c.roundRect(x, 3820, cw, 150, 75); c.lineWidth = 12; c.strokeStyle = YEL; c.stroke(); c.restore(); line(s, x + cw / 2, 3898, G(900, 92), YEL, 'center', 6); });

  // ---------------- FOOTER ----------------
  c.fillStyle = YEL; c.fillRect(0, 4030, W, 170);
  line("YOU DIDN'T CONSENT TO THIS.", 90, 4117, G(900, 92), INK, 'left', 4);
  line('MAP THEM: DEFLOCK.ME', W - 90, 4117, MONO(800, 78), INK, 'right', 2);

  // ---------------- stencil grunge ----------------
  // speckle knock-outs (spray-paint dropouts) + fine grain, so it reads like a street poster
  c.save(); c.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 4500; i++) { const x = hash(i, 1) * W, y = hash(i, 2) * H, r = 1.5 + Math.pow(hash(i, 3), 6) * 10; c.fillStyle = hash(i, 4) > 0.5 ? 'rgba(10,10,10,0.35)' : 'rgba(247,245,238,0.08)'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  c.restore();
  const gr = document.createElement('canvas'); gr.width = gr.height = 512; const g = gr.getContext('2d'), d = g.createImageData(512, 512);
  for (let i = 0; i < d.data.length; i += 4) { const v = hash(i, 9) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; } g.putImageData(d, 0, 0);
  c.save(); c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(gr, 'repeat'); c.fillRect(0, 0, W, H); c.restore();
  // scuffed edges
  const vg = c.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.35)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
