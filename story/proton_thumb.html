<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Proton Mail Shorts Thumbnail</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="s" width="1080" height="1920"></canvas>
<script>
// Proton Mail — YouTube Shorts thumbnail, 1080x1920. Deep Proton purple + cipher rain, the real app inbox in a phone card,
// giant shielded Proton logo, "trackers blocked" toast, headline, creator cutout.
(async () => {
  const c = document.getElementById('s').getContext('2d'), W = 1080, H = 1920, TAU = Math.PI * 2;
  const PUR = '#6D4AFF', PUR2 = '#A995FF', DEEP = '#120A33', INK = '#07041A', YEL = '#FFE14A', RED = '#FF3B5C', GRN = '#2ECC71';
  const D = (s) => `900 ${s}px "Inter Tight", sans-serif`, G = (w, s) => `${w} ${s}px Geist, "Inter Tight", sans-serif`, MONO = (s) => `700 ${s}px "JetBrains Mono", monospace`;
  await Promise.all([document.fonts.load(D(100)), document.fonts.load(G(800, 40)), document.fonts.load(G(600, 40)), document.fonts.load(MONO(30))]);
  const L = async (s) => { const im = new Image(); im.src = s; await im.decode(); return im; };
  const [me, logo, phone] = await Promise.all([L('kal_cutout.png'), L('proton_logo.png'), L('proton_phone.png')]);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
  const hash = (a, b = 0) => { let n = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n ^= n >>> 12; return (n >>> 0) / 4294967296; };
  function word(s, x, y, size, fill, sx = 0.86, rot = -0.03, stroke = INK) { c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, 1); c.font = D(size); c.textAlign = 'center'; c.textBaseline = 'middle'; c.letterSpacing = '-2px'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(s, 10, 14); c.lineWidth = size * 0.16; c.strokeStyle = stroke; c.strokeText(s, 0, 0);
    if (Array.isArray(fill)) { const g = c.createLinearGradient(0, -size / 2, 0, size / 2); fill.forEach((f, i) => g.addColorStop(i / (fill.length - 1), f)); c.fillStyle = g; } else c.fillStyle = fill; c.fillText(s, 0, 0); c.restore(); }
  // ---- background: deep purple + cipher columns (like proton.me hero)
  let g = c.createRadialGradient(W / 2, 980, 0, W / 2, 980, 1300); g.addColorStop(0, '#5B3BE0'); g.addColorStop(0.45, '#2A1580'); g.addColorStop(1, DEEP); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.font = MONO(30); c.textAlign = 'center'; const CH = 'ABCDEFGHKLMNOPQRSUVXYZ0123456789+%'; for (let x = 20; x < W; x += 46) for (let y = 30; y < H; y += 46) { const v = hash(x, y); if (v < 0.35) continue; c.fillStyle = `rgba(169,149,255,${0.04 + 0.14 * hash(y, x)})`; c.fillText(CH[(v * 997 | 0) % CH.length], x, y); } c.restore();
  // ---- headline
  word('YOUR EMAIL', W / 2, 170, 150, '#FFFFFF');
  word('IS BEING', W / 2, 315, 120, '#FFFFFF');
  word('WATCHED!', W / 2, 475, 190, [YEL, '#FFB020'], 0.86);
  // eye with a red slash next to "WATCHED"
  // ---- phone card (real Proton inbox) tilted left
  const pw = 600, ph = pw * phone.height / phone.width; c.save(); c.translate(380, 960); c.rotate(-0.08); c.shadowColor = 'rgba(109,74,255,0.9)'; c.shadowBlur = 90; rr(-pw / 2 - 10, -ph / 2 - 10, pw + 20, ph + 20, 44); c.fillStyle = PUR2; c.fill(); c.shadowColor = 'transparent';
  c.save(); rr(-pw / 2, -ph / 2, pw, ph, 36); c.clip(); c.drawImage(phone, -pw / 2, -ph / 2, pw, ph); c.restore(); c.restore();
  // ---- giant shielded Proton logo (right)
  c.save(); c.translate(790, 870); c.rotate(0.06); c.shadowColor = 'rgba(169,149,255,0.95)'; c.shadowBlur = 90;
  c.beginPath(); c.moveTo(0, -250); c.quadraticCurveTo(150, -200, 230, -210); c.quadraticCurveTo(250, 120, 0, 270); c.quadraticCurveTo(-250, 120, -230, -210); c.quadraticCurveTo(-150, -200, 0, -250); c.closePath(); c.fillStyle = '#FFFFFF'; c.fill(); c.shadowColor = 'transparent';
  c.lineWidth = 12; c.strokeStyle = PUR; c.stroke(); const lw = 300, lh = lw * logo.height / logo.width; c.drawImage(logo, -lw / 2, -lh / 2 + 10, lw, lh);
  // lock badge
  c.translate(170, 190); c.beginPath(); c.arc(0, 0, 70, 0, TAU); c.fillStyle = GRN; c.fill(); c.lineWidth = 8; c.strokeStyle = '#fff'; c.stroke();
  c.fillStyle = '#fff'; rr(-30, -6, 60, 46, 8); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 9; c.beginPath(); c.moveTo(-20, -6); c.lineTo(-20, -16); c.arc(0, -16, 20, Math.PI, 0); c.lineTo(20, -6); c.stroke(); c.fillStyle = GRN; c.beginPath(); c.arc(0, 14, 7, 0, TAU); c.fill(); c.restore();
  // ---- "trackers blocked" toast (from proton.me)
  c.save(); c.translate(730, 1250); c.rotate(-0.03); c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 30; c.shadowOffsetY = 10; rr(-300, -64, 600, 128, 26); c.fillStyle = '#fff'; c.fill(); c.shadowColor = 'transparent';
  c.beginPath(); c.arc(-238, 0, 30, 0, TAU); c.fillStyle = GRN; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 7; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(-252, 0); c.lineTo(-242, 11); c.lineTo(-222, -11); c.stroke();
  c.font = G(800, 40); c.fillStyle = INK; c.textBaseline = 'middle'; c.fillText('7 trackers blocked', -190, -14); c.font = G(600, 28); c.fillStyle = '#6B6890'; c.fillText('End-to-end encrypted 🔒', -190, 30); c.restore();
  // ---- "END-TO-END ENCRYPTED" ribbon
  c.save(); c.translate(W / 2, 600); c.rotate(-0.03); rr(-420, -46, 840, 92, 46); c.fillStyle = PUR; c.fill(); c.lineWidth = 6; c.strokeStyle = '#fff'; c.stroke(); c.font = D(52); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.save(); c.scale(0.9, 1); c.fillText('SWITCH TO PROTON MAIL', 0, 3); c.restore(); c.restore();
  // ---- creator cutout bottom-left
  const mh = 600, mw = mh * me.width / me.height, mx = 40, my = H - mh + 30;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  for (let a = 0; a < 24; a++) o.drawImage(me, mx + Math.cos(a / 24 * TAU) * 10, my + Math.sin(a / 24 * TAU) * 10, mw, mh);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(109,74,255,0.9)'; c.shadowBlur = 60; c.drawImage(off, 0, 0); c.restore(); c.drawImage(me, mx, my, mw, mh);
  // "100% PRIVATE" burst bottom right
  c.save(); c.translate(800, 1620); c.rotate(0.08); c.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, r = i % 2 ? 118 : 146; c.lineTo(Math.cos(a) * r * 1.5, Math.sin(a) * r); } c.closePath(); c.fillStyle = YEL; c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 26; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 8; c.strokeStyle = INK; c.stroke();
  c.font = D(48); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('100% PRIVATE', 0, -24); c.font = D(34); c.fillText('& FREE TO START', 0, 28); c.restore();
  document.body.dataset.ready = '1';
})();
</script></body></html>
